<style>

<body>
<div class="frame">
<p class="eyebrow">Sequence · Diagram Design</p>
<h1>One tool call: the transport queues it, the worker runs it, the transport answers</h1>
<div class="diagram-container">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="srs-title srs-desc">
<title id="srs-title">One tools/call through the server, from the client to the worker and back</title>
<desc id="srs-desc">Five actors: the MCP client, the transport (stdio.py or http_transport.py), the worker, the protocol and the registry. Eight numbered steps: the client sends a tools/call; the transport queues it in the worker with a limit of 64; the worker thread asks the protocol to answer it; the protocol checks the era, the _meta and that the tool name exists; the worker checks the project file and the arguments and runs the tool function from the registry; the registry returns a dictionary or an error; the worker hands the reply to the transport, with a limit of 40 000 characters on the result; the transport writes one line on stdout or an HTTP 200 reply. The worker is busy from step 3 to step 7, so the next call waits in the queue.</desc>
<defs>
<marker id="srs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="srs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="55" y="44" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.5" fill="#4f5d75">THE WORKER IS BUSY FROM STEP 3 TO STEP 7 · THE TRANSPORT KEEPS READING MEANWHILE</text>
<!-- worker-busy band, from step 3 to step 7 -->
<rect x="645" y="282" width="30" height="236" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/>

</g>

<rect x="315" y="82" width="170" height="54" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="400" y="106">Transport</text><text x="400" y="124" font-family="Geist Mono, monospace" font-size="9" font-weight="400" fill="#4f5d75">stdio.py · http_transport.py</text>
<rect x="575" y="82" width="170" height="54" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="660" y="106">Worker</text><text x="660" y="124" font-family="Geist Mono, monospace" font-size="9" font-weight="400" fill="#4f5d75">worker.py</text>
<rect x="835" y="82" width="170" height="54" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="920" y="106">Protocol</text><text x="920" y="124" font-family="Geist Mono, monospace" font-size="9" font-weight="400" fill="#4f5d75">protocol.py</text>
<rect x="1075" y="82" width="170" height="54" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="1160" y="106">Registry</text><text x="1160" y="124" font-family="Geist Mono, monospace" font-size="9" font-weight="400" fill="#4f5d75">registry.py</text>
</g>
<!-- messages -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="148" y1="196" x2="392" y2="196" marker-end="url(#srs-arrow)"/>
<line x1="408" y1="248" x2="652" y2="248" marker-end="url(#srs-arrow)"/>
<line x1="668" y1="300" x2="912" y2="300" marker-end="url(#srs-arrow)"/>
<line x1="912" y1="352" x2="668" y2="352" marker-end="url(#srs-arrow)"/>
<line x1="668" y1="404" x2="1152" y2="404" marker-end="url(#srs-arrow)"/>
<line x1="1152" y1="456" x2="668" y2="456" marker-end="url(#srs-arrow)"/>

</g>
<line x1="392" y1="560" x2="148" y2="560" stroke="#bf4520" stroke-width="1.5" marker-end="url(#srs-arrow-accent)"/>
<!-- labels: title above each arrow, source lines below it -->
<g font-family="Geist Mono, monospace" font-size="10" fill="#2d3142">
<text x="148" y="186">1  tools/call: one JSON message</text>
<text x="148" y="212" fill="#4f5d75">stdio.py:38 · http_transport.py:143</text>
<text x="416" y="238">2  worker.submit: queue of 64 at most</text>
<text x="416" y="264" fill="#4f5d75">stdio.py:43 · http_transport.py:154</text>
<text x="684" y="290">3  answer(message): on the worker</text>
<text x="684" y="316" fill="#4f5d75">worker.py:72 · protocol.py:191</text>
<text x="684" y="342">4  handle: era, _meta, tool name</text>
<text x="684" y="368" fill="#4f5d75">protocol.py:100-105, 168-171</text>
<text x="932" y="394">5  check args, run the tool</text>
<text x="932" y="420" fill="#4f5d75">worker.py:155-158</text>
<text x="932" y="446">6  a dict, or an error</text>
<text x="932" y="472" fill="#4f5d75">worker.py:159-168</text>
<text x="416" y="498">7  reply(result): 40 000 chars at most</text>
<text x="416" y="524" fill="#4f5d75">worker.py:72, 161-163</text>
<text x="156" y="550" fill="#bf4520" font-weight="600">8  a stdout line, or HTTP 200</text>
<text x="156" y="576" fill="#4f5d75">stdio.py:12 · http_transport.py:162</text>
</g>
<line x1="48" y1="612" x2="1232" y2="612" stroke="#2d3142" stroke-opacity="0.2"/>
<g font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">
<rect x="55" y="624" width="24" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/><text x="87" y="634">worker busy: the next call waits in the queue</text>
<text x="55" y="654">ping, tools/list and the rest skip the queue: the transport calls protocol.handle (stdio.py:45)</text>
<text x="55" y="672">cancel on stdio: the reader sets the call's event while the worker runs (worker.py:93)</text>
<text x="55" y="690">cancel on HTTP, modern era: closing the connection (http_transport.py:155-159)</text>
</g>
