<title id="rt-title">The three ways metal-gpu-trace reads a recording</title>
<desc id="rt-desc">Three rows of three boxes, each row a flow from left to right. Row one, a .trace read by trace_tables, trace_count and trace_query: find the trace, export one table with xctrace, filter and return rows or time windows. Row two, a .gputrace read by capture_summary, capture_diff and capture_records: resolve the bundle inside the readable folders, split its capture file into records, then count, compare or list them. Row three, perf_export_trace: find the per-frame table of a run, make one slice per frame, write the Chrome trace file. Under the boxes, a note that every failure comes back as error text.</desc>
