<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What preflight checks before a recording starts</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif','Noto Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1240px;width:100%}
.diagram-container{width:100%;overflow-x:auto}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;min-width:1240px;display:block}
@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Flow · Diagram Design</p>
<h1>Preflight: six checks, in this order, before anything starts</h1>
<div class="diagram-container">
<svg viewBox="0 0 1240 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rp-title rp-desc">
<title id="rp-title">The checks preflight makes before a recording starts</title>
<desc id="rp-desc">Seven boxes in a row joined by arrows: arguments, program, xcrun, disk, screen, lock and start. The first six can refuse the recording; under each one the message it gives is written. If all six pass, the recording starts with memory_pressure when it was asked for and then record_run.</desc>
<defs>
<marker id="rp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="rp-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="24" y="44" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.5" fill="#4f5d75">THE FIRST CHECK THAT FAILS STOPS EVERYTHING · NO PROCESS HAS STARTED · preflight.py:101-137</text>
<text x="24" y="68" font-family="Geist Mono, monospace" font-size="11" fill="#4f5d75">perf_record.sh repeats checks 1, 2, 4 and 6 (defence in depth); the screen is checked only here</text>
<!-- arrows between boxes -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="174" y1="190" x2="196" y2="190" marker-end="url(#rp-arrow)"/>
<line x1="348" y1="190" x2="370" y2="190" marker-end="url(#rp-arrow)"/>
<line x1="522" y1="190" x2="544" y2="190" marker-end="url(#rp-arrow)"/>
<line x1="696" y1="190" x2="718" y2="190" marker-end="url(#rp-arrow)"/>
<line x1="870" y1="190" x2="892" y2="190" marker-end="url(#rp-arrow)"/>
<line x1="1044" y1="190" x2="1066" y2="190" stroke="#bf4520" marker-end="url(#rp-arrow-accent)"/>
</g>
<!-- refusal arrows -->
<g stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" fill="none">
<line x1="99" y1="270" x2="99" y2="326" marker-end="url(#rp-arrow-accent)"/>
<line x1="273" y1="270" x2="273" y2="326" marker-end="url(#rp-arrow-accent)"/>
<line x1="447" y1="270" x2="447" y2="326" marker-end="url(#rp-arrow-accent)"/>
<line x1="621" y1="270" x2="621" y2="326" marker-end="url(#rp-arrow-accent)"/>
<line x1="795" y1="270" x2="795" y2="326" marker-end="url(#rp-arrow-accent)"/>
<line x1="969" y1="270" x2="969" y2="326" marker-end="url(#rp-arrow-accent)"/>
</g>
<!-- check boxes -->
<g>
<rect x="24" y="110" width="150" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="198" y="110" width="150" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="372" y="110" width="150" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="546" y="110" width="150" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="720" y="110" width="150" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="894" y="110" width="150" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="1068" y="110" width="150" height="160" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
</g>
<g font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">
<text x="99" y="136">1 · Arguments</text>
<text x="273" y="136">2 · Program</text>
<text x="447" y="136">3 · xcrun</text>
<text x="621" y="136">4 · Disk</text>
<text x="795" y="136">5 · Screen</text>
<text x="969" y="136">6 · Lock</text>
<text x="1143" y="136">Start</text>
</g>
<g font-family="Geist Mono, monospace" font-size="9" fill="#4f5d75" text-anchor="middle">
<text x="99" y="160">seconds: a whole number</text><text x="99" y="174">from 1 to 3600</text><text x="99" y="188">types of wine, command</text><text x="99" y="202">and environ</text>
<text x="99" y="256" fill="#2d3142">:107-113</text>
<text x="273" y="160">Wine: bin/wine can run</text><text x="273" y="174">native: a file with the</text><text x="273" y="188">execute bit</text><text x="273" y="202">attach: not checked</text>
<text x="273" y="256" fill="#2d3142">:115-119</text>
<text x="447" y="160">xcrun found on PATH?</text><text x="447" y="174">(not checked on Windows)</text>
<text x="447" y="256" fill="#2d3142">:120-121</text>
<text x="621" y="160">free GB in TMPDIR and</text><text x="621" y="174">the runs folder</text><text x="621" y="188">2 + 0.8 GB per second</text><text x="621" y="202">Windows: 1 GB, runs only</text><text x="621" y="216">PERF_MIN_FREE_GB wins</text>
<text x="621" y="256" fill="#2d3142">:122-131</text>
<text x="795" y="160">ioreg says the session</text><text x="795" y="174">is locked?</text><text x="795" y="188">unreadable: passes</text><text x="795" y="202">ALLOW_LOCKED=1 skips</text><text x="795" y="216">(not on Windows)</text>
<text x="795" y="256" fill="#2d3142">:132-134</text>
<text x="969" y="160">recording.lock/pid names</text><text x="969" y="174">a live process?</text><text x="969" y="188">missing, odd or dead</text><text x="969" y="202">owner: passes</text>
<text x="969" y="256" fill="#2d3142">:135-137</text>
<text x="1143" y="160">memory_pressure, if</text><text x="1143" y="174">asked for, then</text><text x="1143" y="188">record_run</text>
<text x="1143" y="256" fill="#2d3142">recording.py:316-318</text>
</g>
<!-- refusal messages -->
<text x="1086" y="330" font-family="Geist Mono, monospace" font-size="9" font-weight="600" letter-spacing="1" fill="#bf4520"><tspan x="1086" dy="0">REFUSED WITH A</tspan><tspan x="1086" dy="14">ToolError THAT SAYS</tspan><tspan x="1086" dy="14">WHAT TO DO</tspan></text>
<g stroke="#bf4520" stroke-opacity="0.6" fill="rgba(191,69,32,0.04)">
<rect x="24" y="334" width="150" height="110" rx="4"/>
<rect x="198" y="334" width="150" height="110" rx="4"/>
<rect x="372" y="334" width="150" height="110" rx="4"/>
<rect x="546" y="334" width="150" height="110" rx="4"/>
<rect x="720" y="334" width="150" height="110" rx="4"/>
<rect x="894" y="334" width="150" height="110" rx="4"/>
</g>
<g font-family="Geist Mono, monospace" font-size="9" fill="#2d3142" text-anchor="middle">
<text x="99" y="354">seconds is a whole</text><text x="99" y="368">number from 1 to 3600</text>
<text x="273" y="354">no Wine at bin/wine</text><text x="273" y="368">inside that Wine</text><text x="273" y="382">directory (pass native</text><text x="273" y="396">for a macOS program)</text><text x="273" y="414">or: NAME is not an</text><text x="273" y="428">executable file</text>
<text x="447" y="354">xcrun is not on PATH:</text><text x="447" y="368">install Xcode or the</text><text x="447" y="382">command line tools</text>
<text x="621" y="354">not enough free disk</text><text x="621" y="368">on WHERE: N GB free,</text><text x="621" y="382">M GB needed</text><text x="621" y="396">(PERF_MIN_FREE_GB</text><text x="621" y="410">overrides)</text>
<text x="795" y="354">the screen is locked:</text><text x="795" y="368">frames unpaced, numbers</text><text x="795" y="382">do not compare; unlock</text><text x="795" y="396">or set ALLOW_LOCKED=1</text>
<text x="969" y="354">another recording is</text><text x="969" y="368">running; one runs at a</text><text x="969" y="382">time. If none is, remove</text><text x="969" y="396">the lock folder</text>
</g>
<line x1="24" y1="486" x2="1216" y2="486" stroke="#2d3142" stroke-opacity="0.2"/>
<g font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">
<rect x="24" y="500" width="24" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><text x="56" y="510">the recording goes on</text>
<line x1="250" y1="506" x2="290" y2="506" stroke="#bf4520" stroke-dasharray="5,4" marker-end="url(#rp-arrow-accent)"/><text x="298" y="510">a failed check</text>
<text x="440" y="506">line numbers are in preflight.py unless written otherwise</text>
<text x="440" y="522">the unlisted checks (label, memory_free_pct) come before, in recording.py</text>
</g>
</svg>
</div>
</div>
</body>
</html>
