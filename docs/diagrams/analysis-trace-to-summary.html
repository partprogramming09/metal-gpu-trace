<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif','Noto Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1240px;width:100%}
.diagram-container{width:100%;overflow-x:auto}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}

<body>
<div class="frame">
<p class="eyebrow">Flow · Diagram Design</p>
<h1>From a .trace to a summary: export the tables, count the frames, write the files</h1>
<div class="diagram-container">
<svg viewBox="0 0 1240 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="at-title at-desc">
<title id="at-title">What perf_report.py does with a .trace</title>
<desc id="at-desc">Eight boxes in two rows. Top row: export the table of contents and the tables with xctrace; check the table of contents (no metal-gpu-intervals is an error, other absent tables go to missing_tables); read the launched program's GPU work; decide whether some work was never presented. Bottom row: the frame numbers (fps_estimate from the median gap), the optional tables, pacing and hitches, and writing the frames table and the summary.</desc>
<defs>
<marker id="at-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="at-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="44" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.5" fill="#4f5d75">ONLY metal-gpu-intervals IS REQUIRED · THE OTHER TABLES ARE OPTIONAL · perf_report.py</text>
<text x="48" y="68" font-family="Geist Mono, monospace" font-size="11" fill="#4f5d75">dashed boxes are decisions · every temporary XML file is deleted, even when a step fails (finally, :825-829)</text>
<!-- arrows -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="288" y1="160" x2="350" y2="160" marker-end="url(#at-arrow)"/>
<line x1="592" y1="160" x2="654" y2="160" marker-end="url(#at-arrow)"/>
<line x1="896" y1="160" x2="958" y2="160" marker-end="url(#at-arrow)"/>
<path d="M1080 230 V272 H168 V312" marker-end="url(#at-arrow)"/>
<line x1="288" y1="380" x2="350" y2="380" marker-end="url(#at-arrow)"/>
<line x1="592" y1="380" x2="654" y2="380" marker-end="url(#at-arrow)"/>
<line x1="896" y1="380" x2="958" y2="380" stroke="#bf4520" marker-end="url(#at-arrow-accent)"/>
</g>
<!-- row 1 -->
<rect x="48" y="90" width="240" height="140" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="352" y="90" width="240" height="140" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="656" y="90" width="240" height="140" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="960" y="90" width="240" height="140" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="5,4"/>
<!-- row 2 -->
<rect x="48" y="312" width="240" height="140" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="352" y="312" width="240" height="140" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="656" y="312" width="240" height="140" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="960" y="312" width="240" height="140" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
<g font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">
<text x="64" y="116">1 · Export</text>
<text x="368" y="116">2 · Table of contents?</text>
<text x="672" y="116">3 · The program's GPU work</text>
<text x="976" y="116">4 · Never presented?</text>
<text x="64" y="338">5 · The frame numbers</text>
<text x="368" y="338">6 · The optional tables</text>
<text x="672" y="338">7 · Pacing and hitches</text>
<text x="976" y="338">8 · Write</text>
</g>
<g font-family="Geist Mono, monospace" font-size="9" fill="#4f5d75">
<text x="64" y="140">xctrace export: the contents,</text><text x="64" y="154">then one table per xpath,</text><text x="64" y="168">two at a time; a file cut by</text><text x="64" y="182">xctrace's crash is accepted</text>
<text x="64" y="214" fill="#2d3142">:49-66, :95-123</text>
<text x="368" y="140">no metal-gpu-intervals:</text><text x="368" y="154">error, no summary written</text><text x="368" y="168">other table absent: its name</text><text x="368" y="182">goes to missing_tables</text>
<text x="368" y="214" fill="#2d3142">:190-197, :664</text>
<text x="672" y="140">rows of the launched pid</text><text x="672" y="154">only, summed per frame and</text><text x="672" y="168">channel; other pids are</text><text x="672" y="182">counted apart (noisy basis)</text>
<text x="672" y="214" fill="#2d3142">:643-693</text>
<text x="976" y="140">a frame number with 32+</text><text x="976" y="154">command buffers, 8x the</text><text x="976" y="168">median, over 1 s: left out</text><text x="976" y="182">and reported as unpresented</text>
<text x="976" y="214" fill="#2d3142">:200-245, :696-701</text>
<text x="64" y="362">frame_gpu_ms, per channel,</text><text x="64" y="376">frame_interval_ms, encoders,</text><text x="64" y="390">gpu_idle; fps_estimate is</text><text x="64" y="404">1000 / median of the gaps</text>
<text x="64" y="436" fill="#2d3142">:703-729</text>
<text x="368" y="362">memory, RSS, AGX, clock and</text><text x="368" y="376">thermal state, compiler, CPU,</text><text x="368" y="390">allocations, spills, errors,</text><text x="368" y="404">counters: absent = key absent</text>
<text x="368" y="436" fill="#2d3142">:731-817</text>
<text x="672" y="362">1% and 0.1% low, stutter,</text><text x="672" y="376">jitter, throttling; each slow</text><text x="672" y="390">frame gets one cause, the 20</text><text x="672" y="404">longest are listed</text>
<text x="672" y="436" fill="#2d3142">:818-822, :253-320</text>
<text x="976" y="362">frames.csv.gz, the common</text><text x="976" y="376">block and the summary .json;</text><text x="976" y="390">recording.finish adds layer,</text><text x="976" y="404">context and tier afterwards</text>
<text x="976" y="436" fill="#2d3142">:831-837</text>
</g>
<line x1="48" y1="500" x2="1192" y2="500" stroke="#2d3142" stroke-opacity="0.2"/>
<g font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">
<rect x="48" y="514" width="24" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/><text x="80" y="524">decision</text>
<rect x="200" y="514" width="24" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><text x="232" y="524">the files are written</text>
<text x="440" y="524">line numbers are in perf_report.py</text>
</g>
</svg>

</div>
