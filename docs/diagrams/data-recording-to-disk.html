<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From a recording to disk, with the lock</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif','Noto Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1280px;width:100%}
.diagram-container{width:100%;overflow-x:auto}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;min-width:1280px;display:block}
@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Sequence · Diagram Design</p>
<h1>From a recording to disk: who writes what, and when the lock is held</h1>
<div class="diagram-container">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="drd-title drd-desc">
<title id="drd-title">A recording on macOS, from the first check to the files on disk</title>
<desc id="drd-desc">Five actors: the server's recording.py, the lock folder, perf_record.sh, perf_report.py and the runs folder. Eight numbered steps: the server checks the lock; the script takes it; the script and Instruments write the samplers and the trace; the script starts the report; the report writes the compressed tables and a first summary; the script deletes the trace and applies KEEP_RUNS; the script frees the lock; the server finishes, applies the disk limit and rewrites the summary.</desc>
<defs>
<marker id="drd-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="drd-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="55" y="44" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.5" fill="#4f5d75">THE LOCK IS HELD FROM STEP 2 TO STEP 7 · THE SUMMARY IS WRITTEN TWICE (STEPS 5 AND 8)</text>
<!-- lock-held band, from step 2 to step 7 -->
<rect x="385" y="248" width="30" height="304" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/>
<!-- lifelines -->
<g stroke="#2d3142" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3,4">
<line x1="140" y1="136" x2="140" y2="650"/><line x1="400" y1="136" x2="400" y2="650"/><line x1="660" y1="136" x2="660" y2="650"/><line x1="920" y1="136" x2="920" y2="650"/><line x1="1160" y1="136" x2="1160" y2="650"/>
</g>
<!-- actor boxes -->
<g font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">
<rect x="55" y="82" width="170" height="54" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="140" y="106">MCP server</text><text x="140" y="124" font-family="Geist Mono, monospace" font-size="9" font-weight="400" fill="#4f5d75">recording.py</text>
<rect x="315" y="82" width="170" height="54" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="400" y="106">Lock</text><text x="400" y="124" font-family="Geist Mono, monospace" font-size="9" font-weight="400" fill="#4f5d75">recording.lock/pid</text>
<rect x="575" y="82" width="170" height="54" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="660" y="106">Script</text><text x="660" y="124" font-family="Geist Mono, monospace" font-size="9" font-weight="400" fill="#4f5d75">perf_record.sh</text>
<rect x="835" y="82" width="170" height="54" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="920" y="106">Report</text><text x="920" y="124" font-family="Geist Mono, monospace" font-size="9" font-weight="400" fill="#4f5d75">perf_report.py</text>
<rect x="1075" y="82" width="170" height="54" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="1160" y="106">Runs folder</text><text x="1160" y="124" font-family="Geist Mono, monospace" font-size="9" font-weight="400" fill="#4f5d75">perf-runs/</text>
</g>
<!-- messages -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="148" y1="200" x2="392" y2="200" marker-end="url(#drd-arrow)" stroke-dasharray="5,4"/>
<line x1="652" y1="258" x2="408" y2="258" marker-end="url(#drd-arrow)"/>
<line x1="668" y1="316" x2="1152" y2="316" marker-end="url(#drd-arrow)"/>
<line x1="668" y1="374" x2="912" y2="374" marker-end="url(#drd-arrow)"/>
<line x1="928" y1="432" x2="1152" y2="432" marker-end="url(#drd-arrow)"/>
<line x1="668" y1="490" x2="1152" y2="490" marker-end="url(#drd-arrow)"/>
<line x1="652" y1="548" x2="408" y2="548" marker-end="url(#drd-arrow)"/>
</g>
<line x1="148" y1="606" x2="1152" y2="606" stroke="#bf4520" stroke-width="1.5" marker-end="url(#drd-arrow-accent)"/>
<!-- labels: title above each arrow, source lines below it -->
<g font-family="Geist Mono, monospace" font-size="10" fill="#2d3142">
<text x="148" y="190">1  preflight reads the pid (never takes it)</text>
<text x="148" y="216" fill="#4f5d75">preflight.py:74-98, 135</text>
<text x="437" y="248">2  mkdir lock, write pid</text>
<text x="437" y="274" fill="#4f5d75">perf_record.sh:52-62</text>
<rect x="690" y="294" width="440" height="16" fill="#f5f5f5"/><text x="700" y="306">3  samplers: .rss.csv .agx.csv · xctrace: .trace</text>
<rect x="690" y="322" width="440" height="14" fill="#f5f5f5"/><text x="700" y="332" fill="#4f5d75">perf_record.sh:104-117, 140-151</text>
<text x="676" y="364">4  python3 perf_report.py</text>
<text x="676" y="390" fill="#4f5d75">perf_record.sh:160</text>
<text x="936" y="422">5  .csv.gz tables + first .json</text>
<text x="936" y="448" fill="#4f5d75">perf_report.py:745, 831, 836</text>
<rect x="690" y="468" width="440" height="16" fill="#f5f5f5"/><text x="700" y="480">6  rm .trace unless KEEP_TRACE · KEEP_RUNS prune</text>
<rect x="690" y="496" width="440" height="14" fill="#f5f5f5"/><text x="700" y="506" fill="#4f5d75">perf_record.sh:163-164</text>
<text x="437" y="538">7  rm lock (EXIT trap)</text>
<text x="437" y="564" fill="#4f5d75">perf_record.sh:65-73</text>
<rect x="190" y="584" width="880" height="16" fill="#f5f5f5"/><text x="200" y="596" fill="#bf4520" font-weight="600">8  finish: adds layer, context, tier · disk limit if no other recording runs · rewrites .json</text>
<rect x="190" y="612" width="880" height="14" fill="#f5f5f5"/><text x="200" y="622" fill="#4f5d75">recording.py:341-350</text>
</g>
<line x1="48" y1="676" x2="1232" y2="676" stroke="#2d3142" stroke-opacity="0.2"/>
<g font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">
<rect x="55" y="690" width="24" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/><text x="87" y="700">lock held</text>
<text x="240" y="700">dashed arrow = read only · run by hand (perf_record.sh alone) there are no steps 1 and 8, so no disk limit · Windows: its own lock code</text>
</g>
</svg>
</div>
</div>
</body>
</html>
