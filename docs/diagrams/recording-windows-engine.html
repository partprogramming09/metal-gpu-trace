<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif','Noto Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}

<body>
<div class="frame">
<p class="eyebrow">Flow · Diagram Design</p>
<h1>The Windows engine: one run, eight steps, three possible sources of frames</h1>
<div class="diagram-container">
<svg viewBox="0 0 1240 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rw-title rw-desc">
<title id="rw-title">One recording by perf_record_windows.py</title>
<desc id="rw-desc">Eight boxes in two rows. Top row: take the lock, launch or find the program, choose the frame source (PresentMon if installed, else a DWM sampler), the one-second loop. Bottom row: stop and clean up, pick the frames (the drawstress log, else PresentMon rows, else DWM samples, else an error), write the frames table and the summary, and recording.finish adds layer, context, tier and the disk limit.</desc>
<defs>
<marker id="rw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="rw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="44" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.5" fill="#4f5d75">NO INSTRUMENTS, NO .trace · THE FRAMES COME FROM THE FIRST SOURCE THAT HAS ANY · perf_record_windows.py</text>
<text x="48" y="68" font-family="Geist Mono, monospace" font-size="11" fill="#4f5d75">dashed boxes are decisions · a failure at any step deletes the run's files and frees the lock (finally, :929-947)</text>

</g>

<rect x="48" y="90" width="240" height="140" rx="6" fill="#f5f5f5" stroke="#2d3142"/>

<g font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">
<text x="64" y="116">1 · Lock</text>
<text x="368" y="116">2 · Program</text>
<text x="672" y="116">3 · Frame source?</text>
<text x="976" y="116">4 · One-second loop</text>
<text x="64" y="338">5 · Stop and clean up</text>
<text x="368" y="338">6 · Which frames?</text>
<text x="672" y="338">7 · Write</text>
<text x="976" y="338">8 · recording.finish</text>
</g>
<g font-family="Geist Mono, monospace" font-size="9" fill="#4f5d75">
<text x="64" y="140">mkdir the lock, write the pid</text><text x="64" y="154">stale owner: take it over once</text><text x="64" y="168">else: another recording is</text><text x="64" y="182">running (RuntimeError)</text>
<text x="64" y="214" fill="#2d3142">:573-597</text>
<text x="368" y="140">launch it with DRAWSTRESS_LOG</text><text x="368" y="154">set (Popen), or find the pid</text><text x="368" y="168">of an attached process by</text><text x="368" y="182">number or name</text>
<text x="368" y="214" fill="#2d3142">:612-645</text>
<text x="672" y="140">PresentMon found (env, cache,</text><text x="672" y="154">PATH)? yes: run it on the pid,</text><text x="672" y="168">--timed N. no: a 1 ms thread</text><text x="672" y="182">reads DWM composition times</text>
<text x="672" y="214" fill="#2d3142">:647-666, :415-430</text>
<text x="976" y="140">each second: sample RSS,</text><text x="976" y="154">stop on cancel, on the</text><text x="976" y="168">deadline or when the program</text><text x="976" y="182">exits by itself</text>
<text x="976" y="214" fill="#2d3142">:673-705</text>
<text x="64" y="362">terminate the program tree,</text><text x="64" y="376">wait up to 15 s for PresentMon</text><text x="64" y="390">overrun or cancel: kill and</text><text x="64" y="404">delete the run's files</text>
<text x="64" y="436" fill="#2d3142">:707-757</text>
<text x="368" y="362">1 drawstress log lines</text><text x="368" y="376">2 PresentMon rows</text><text x="368" y="390">3 DWM samples (whole desktop)</text><text x="368" y="404">4 none: "no frame data" error</text>
<text x="368" y="436" fill="#2d3142">:787-844 · gpu.source :876</text>
<text x="672" y="362">frames.csv.gz, then the summary</text><text x="672" y="376">.json (the three fixed missing</text><text x="672" y="390">tables), then KEEP_RUNS cleanup</text>
<text x="672" y="436" fill="#2d3142">:847-927</text>
<text x="976" y="362">adds layer, context, tier,</text><text x="976" y="376">applies METAL_TRACE_MAX_DISK_MB</text><text x="976" y="390">and rewrites the .json</text>
<text x="976" y="436" fill="#2d3142">recording.py:385, 337-351</text>
</g>
<line x1="48" y1="500" x2="1192" y2="500" stroke="#2d3142" stroke-opacity="0.2"/>
<g font-family="Geist Mono, monospace" font-size="10" fill="#4f5d75">
<rect x="48" y="514" width="24" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/><text x="80" y="524">decision</text>
<rect x="200" y="514" width="24" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><text x="232" y="524">shared with macOS</text>
<text x="420" y="524">step 8 is the same function macOS ends with · the engine can also run by hand as a script (main, :950)</text>
</g>
