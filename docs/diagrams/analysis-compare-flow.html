<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif','Noto Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1240px;width:100%}
.diagram-container{width:100%;overflow-x:auto}

svg{width:100%;min-width:1240px;display:block}

<body>
<div class="frame">
<p class="eyebrow">Flow · Diagram Design</p>
<h1>Comparing a run: a range and a margin decide, never one number against one number</h1>
<div class="diagram-container">
<svg viewBox="0 0 1240 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ac-title ac-desc">
<title id="ac-title">How analysis.py and experiments.py compare and judge runs</title>
<desc id="ac-desc">Eight boxes in two rows. Top row: read the summaries (optionally recomputed without the first seconds), perf_compare (changes, no verdict), perf_baseline (the range of several equal runs and its spread), and perf_check's decision of each metric against that range with a margin. Bottom row: the verdict regressed, improved or same; perf_ab, which says better or worse only when the ranges do not overlap; perf_gate, which checks fixed budgets and fails on missing data; and the warnings that never change a verdict.</desc>
<defs>
<marker id="ac-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="ac-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="44" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.5" fill="#4f5d75">THE NOISE OF EQUAL RUNS IS THE RULER · analysis.py, experiments.py</text>
<text x="48" y="68" font-family="Geist Mono, monospace" font-size="11" fill="#4f5d75">dashed box is the decision · boxes 6 to 8 are other ways to decide, not steps that follow 5</text>

</g>

<g font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">
<text x="64" y="116">1 · Read the summaries</text>
<text x="368" y="116">2 · perf_compare</text>
<text x="672" y="116">3 · perf_baseline</text>
<text x="976" y="116">4 · perf_check: each metric</text>
<text x="64" y="338">5 · The verdict</text>
<text x="368" y="338">6 · perf_ab</text>
<text x="672" y="338">7 · perf_gate</text>
<text x="976" y="338">8 · Warnings</text>
</g>
<g font-family="Geist Mono, monospace" font-size="9" fill="#4f5d75">
<text x="64" y="140">the .json of each run; with</text><text x="64" y="154">skip_s, FPS, lows, stutter</text><text x="64" y="168">and hitches are recomputed</text><text x="64" y="182">from frames.csv without the</text><text x="64" y="196">first seconds (start-up)</text>
<text x="64" y="214" fill="#2d3142">analysis.py:552-599</text>
<text x="368" y="140">change = b - a</text><text x="368" y="154">change % = 100 x change / a</text><text x="368" y="168">(a share changes in points)</text><text x="368" y="182">no verdict, no threshold</text>
<text x="368" y="214" fill="#2d3142">:166-242, :392-396</text>
<text x="672" y="140">copies of N equal runs: the</text><text x="672" y="154">range min to max per metric</text><text x="672" y="168">spread_pct = 200 x width /</text><text x="672" y="182">(max + min): reported only</text>
<text x="672" y="214" fill="#2d3142">:259-314</text>
<text x="976" y="140">fps, gpu_ms_mean: margin 3 %</text><text x="976" y="154">(margin_pct) past the range</text><text x="976" y="168">encoder and buffer counts:</text><text x="976" y="182">no margin, exact</text><text x="976" y="196">no value: unchecked</text>
<text x="976" y="214" fill="#2d3142">:317-330, :351-367</text>
<text x="64" y="362">any metric worse: regressed</text><text x="64" y="376">some better, none worse:</text><text x="64" y="390">improved; else same</text><text x="64" y="404">Windows vs Metal: FPS only</text>
<text x="64" y="436" fill="#2d3142">:350-368</text>
<text x="368" y="362">A B B A, 1 to 5 rounds</text><text x="368" y="376">better or worse only if every</text><text x="368" y="390">b is outside the a range</text><text x="368" y="404">else same; no values: unknown</text>
<text x="368" y="436" fill="#2d3142">experiments.py:36-45, :48-69</text>
<text x="672" y="362">fixed budgets: a floor or a</text><text x="672" y="376">ceiling per metric</text><text x="672" y="390">a missing value fails; so</text><text x="672" y="404">does an unpresented run</text>
<text x="672" y="436" fill="#2d3142">analysis.py:471-500</text>
<text x="976" y="362">under 100 frames, unpresented,</text><text x="976" y="376">noisy GPU, other tier, locked</text><text x="976" y="390">screen, other layer or state:</text><text x="976" y="404">reported, never decide</text>
<text x="976" y="436" fill="#2d3142">:187-221, :374-383</text>
</g>
