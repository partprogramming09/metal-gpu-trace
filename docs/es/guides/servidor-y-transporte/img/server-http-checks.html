<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las comprobaciones de un POST a /mcp, en orden</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 800px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; max-width: 800px; height: auto; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flujo · Diagram Design</p>
    <h1>HTTP: seis comprobaciones en orden, y el estado con que responde cada una</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 800 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="server-http-checks-title server-http-checks-desc">
        <title id="server-http-checks-title">Las comprobaciones de un POST a /mcp, en orden</title>
        <desc id="server-http-checks-desc">Siete cajas en fila: ruta, host y origen, token, tamaño, JSON, cabeceras y ejecución; bajo las seis primeras, el estado con que responde cada una cuando rechaza la petición, y si todas pasan, la petición se ejecuta.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="800" height="608" fill="#f5f5f5"/>

        <!-- pass arrows between the seven boxes; the last one leads to the focal box -->
        <g stroke="#4f5d75" stroke-width="1.2" fill="none">
          <line x1="92" y1="68" x2="128" y2="68" marker-end="url(#arrow)"/>
          <line x1="208" y1="68" x2="244" y2="68" marker-end="url(#arrow)"/>
          <line x1="324" y1="68" x2="360" y2="68" marker-end="url(#arrow)"/>
          <line x1="440" y1="68" x2="476" y2="68" marker-end="url(#arrow)"/>
          <line x1="556" y1="68" x2="592" y2="68" marker-end="url(#arrow)"/>
        </g>
        <line x1="672" y1="68" x2="708" y2="68" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- refusal drops from the first six boxes to their answers -->
        <g stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" fill="none">
          <line x1="52" y1="104" x2="52" y2="128" marker-end="url(#arrow)"/>
          <line x1="168" y1="104" x2="168" y2="128" marker-end="url(#arrow)"/>
          <line x1="284" y1="104" x2="284" y2="128" marker-end="url(#arrow)"/>
          <line x1="400" y1="104" x2="400" y2="128" marker-end="url(#arrow)"/>
          <line x1="516" y1="104" x2="516" y2="128" marker-end="url(#arrow)"/>
          <line x1="632" y1="104" x2="632" y2="128" marker-end="url(#arrow)"/>
        </g>

        <!-- check boxes -->
        <g fill="#f5f5f5" stroke="#2d3142" stroke-width="1">
          <rect x="12" y="32" width="80" height="72" rx="6"/>
          <rect x="128" y="32" width="80" height="72" rx="6"/>
          <rect x="244" y="32" width="80" height="72" rx="6"/>
          <rect x="360" y="32" width="80" height="72" rx="6"/>
          <rect x="476" y="32" width="80" height="72" rx="6"/>
          <rect x="592" y="32" width="80" height="72" rx="6"/>
        </g>
        <rect x="708" y="32" width="80" height="72" rx="6" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1.5"/>

        <g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">
          <text x="52" y="73">Ruta</text>
          <text x="168" y="70">Host y</text>
          <text x="168" y="88">Origin</text>
          <text x="284" y="73">Token</text>
          <text x="400" y="73">Tamaño</text>
          <text x="516" y="73">JSON</text>
          <text x="632" y="73">Cabeceras</text>
          <text x="748" y="73">Ejecutar</text>
        </g>

        <!-- "pasa" sits in each gap, above its arrow -->
        <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75" text-anchor="middle">
          <text x="110" y="56">pasa</text>
          <text x="226" y="56">pasa</text>
          <text x="342" y="56">pasa</text>
          <text x="458" y="56">pasa</text>
          <text x="574" y="56">pasa</text>
          <text x="690" y="56">pasa</text>
        </g>

        <!-- refusal answers, one cell per check -->
        <g fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-opacity="0.6" stroke-dasharray="5,4">
          <rect x="12" y="128" width="80" height="120" rx="4"/>
          <rect x="128" y="128" width="80" height="120" rx="4"/>
          <rect x="244" y="128" width="80" height="120" rx="4"/>
          <rect x="360" y="128" width="80" height="120" rx="4"/>
          <rect x="476" y="128" width="80" height="120" rx="4"/>
          <rect x="592" y="128" width="80" height="120" rx="4"/>
        </g>
        <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle">
          <text x="52" y="150" font-weight="600">404</text>
          <text x="52" y="168" fill="#4f5d75">vacío</text>
          <text x="168" y="150" font-weight="600">403</text>
          <text x="168" y="168" fill="#4f5d75">vacío</text>
          <text x="284" y="150" font-weight="600">401</text>
          <text x="284" y="168" fill="#4f5d75">vacío</text>
          <text x="400" y="150" font-weight="600">413</text>
          <text x="400" y="168" fill="#4f5d75">vacío</text>
          <text x="516" y="150" font-weight="600">400</text>
          <text x="516" y="186" fill="#4f5d75">error de</text>
          <text x="516" y="204" fill="#4f5d75">análisis</text>
          <text x="632" y="150" font-weight="600">400 o 404</text>
        </g>
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="14" fill="#2d3142" text-anchor="middle">
          <text x="516" y="168">-32700</text>
          <text x="632" y="168">-32020</text>
          <text x="632" y="186">-32022</text>
          <text x="632" y="204">-32600</text>
          <text x="632" y="222">-32601</text>
        </g>

        <!-- legend -->
        <rect x="12" y="284" width="24" height="14" rx="3" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1.5"/>
        <line x1="176" y1="291" x2="212" y2="291" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">
          <text x="44" y="296">se ejecuta</text>
          <text x="220" y="296">línea discontinua: un check falla y el cliente recibe el rechazo</text>
        </g>

        <!-- key: what each check reads, and where -->
        <line x1="12" y1="312" x2="788" y2="312" stroke="#2d3142" stroke-opacity="0.2"/>
        <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#2d3142">
          <text x="12" y="332">El primer check que falla corta la petición; nada se ejecuta (:118-168).</text>
          <text x="12" y="352">404, 403, 401 y 413 llevan el cuerpo vacío a propósito (http_transport.py:99-101).</text>
          <text x="12" y="372">1 Ruta: exactamente /mcp; una query o una barra final también fallan (:119-120).</text>
          <text x="12" y="392">2 Host y Origin: localhost o 127.0.0.1, cualquier puerto (:108-111, 121-122).</text>
          <text x="12" y="412">Sin Host se rechaza; Origin solo se comprueba si se envía.</text>
          <text x="12" y="432">3 Token: Bearer igual al token, comparado en tiempo constante (:113-116, 123-124).</text>
          <text x="12" y="452">4 Tamaño: Content-Length solo dígitos, de 0 a 1 000 000 (:125-129).</text>
          <text x="12" y="472">5 JSON: cuerpo UTF-8 y JSON válido, sin anidar demasiado (:130-133).</text>
          <text x="12" y="492">6 Cabeceras: check_headers (:46-82), cabeceras y cuerpo deben casar (:134-136).</text>
          <text x="12" y="512">7 Ejecutar: notificación 202, tools/call al worker, resto a handle, 200 (:137-168).</text>
          <text x="12" y="532">GET y DELETE: 405 al momento, antes de cualquier check (:170-174).</text>
          <text x="12" y="552">Un error de herramienta llega como 200 si la cabecera ya pasó (:162, :168).</text>
          <text x="12" y="572">La respuesta no lleva cuerpo, salvo que sea JSON-RPC.</text>
          <text x="12" y="592">Números de línea en http_transport.py.</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
