<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un tools/call: del cliente al worker y de vuelta</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 800px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; max-width: 800px; height: auto; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Secuencia · Diagram Design</p>
    <h1>Un tools/call: la cola lo guarda, el worker lo ejecuta y el transporte responde</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 800 896" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="server-request-sequence-title server-request-sequence-desc">
        <title id="server-request-sequence-title">Un tools/call del cliente al worker y de vuelta</title>
        <desc id="server-request-sequence-desc">Cinco actores, el cliente MCP, el transporte, el worker, el protocolo y el registro, con ocho pasos numerados de un tools/call; el worker está ocupado del paso 3 al paso 7 y la llamada siguiente espera en la cola.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="800" height="896" fill="#f5f5f5"/>

        <!-- lifelines -->
        <g stroke="#2d3142" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3,4">
          <line x1="80" y1="104" x2="80" y2="600"/>
          <line x1="252" y1="104" x2="252" y2="600"/>
          <line x1="420" y1="104" x2="420" y2="600"/>
          <line x1="568" y1="104" x2="568" y2="600"/>
          <line x1="720" y1="104" x2="720" y2="600"/>
        </g>

        <!-- worker busy band, steps 3 to 7 -->
        <rect x="412" y="288" width="16" height="240" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1"/>

        <!-- messages, drawn before the boxes and the label masks -->
        <g stroke="#4f5d75" stroke-width="1.2" fill="none">
          <line x1="88" y1="184" x2="244" y2="184" marker-end="url(#arrow)"/>
          <line x1="260" y1="240" x2="412" y2="240" marker-end="url(#arrow)"/>
          <line x1="428" y1="296" x2="560" y2="296" marker-end="url(#arrow)"/>
          <line x1="560" y1="352" x2="428" y2="352" marker-end="url(#arrow)"/>
          <line x1="428" y1="408" x2="712" y2="408" marker-end="url(#arrow)"/>
          <line x1="712" y1="464" x2="428" y2="464" marker-end="url(#arrow)"/>
          <line x1="412" y1="520" x2="260" y2="520" marker-end="url(#arrow)"/>
          <line x1="244" y1="576" x2="88" y2="576" marker-end="url(#arrow)"/>
        </g>

        <!-- actor boxes -->
        <g fill="#f5f5f5" stroke="#2d3142" stroke-width="1">
          <rect x="12" y="16" width="136" height="88" rx="6"/>
          <rect x="164" y="16" width="176" height="88" rx="6"/>
          <rect x="356" y="16" width="128" height="88" rx="6"/>
          <rect x="500" y="16" width="136" height="88" rx="6"/>
          <rect x="652" y="16" width="136" height="88" rx="6"/>
        </g>
        <g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">
          <text x="80" y="44">Cliente MCP</text>
          <text x="252" y="44">Transporte</text>
          <text x="420" y="44">Worker</text>
          <text x="568" y="44">Protocolo</text>
          <text x="720" y="44">Registro</text>
        </g>
        <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75" text-anchor="middle">
          <text x="80" y="64">el programa</text>
          <text x="80" y="82">del agente</text>
        </g>
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="14" fill="#4f5d75" text-anchor="middle">
          <text x="252" y="64">stdio.py</text>
          <text x="252" y="82">http_transport.py</text>
          <text x="420" y="66">worker.py</text>
          <text x="568" y="66">protocol.py</text>
          <text x="720" y="66">registry.py</text>
        </g>

        <!-- label masks, then labels: each label sits 8px above its arrow -->
        <g fill="#f5f5f5">
          <rect x="95" y="140" width="142" height="36" rx="2"/>
          <rect x="265" y="196" width="142" height="36" rx="2"/>
          <rect x="436" y="252" width="116" height="36" rx="2"/>
          <rect x="433" y="308" width="134" height="36" rx="2"/>
          <rect x="490" y="364" width="160" height="36" rx="2"/>
          <rect x="502" y="420" width="136" height="36" rx="2"/>
          <rect x="257" y="476" width="142" height="36" rx="2"/>
          <rect x="98" y="532" width="136" height="36" rx="2"/>
        </g>
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="14" text-anchor="middle">
          <text x="166" y="154" fill="#2d3142">1 tools/call</text>
          <text x="166" y="170" fill="#4f5d75">un mensaje JSON</text>
          <text x="336" y="210" fill="#2d3142">2 worker.submit</text>
          <text x="336" y="226" fill="#4f5d75">cola: máx. 64</text>
          <text x="494" y="266" fill="#2d3142">3 answer()</text>
          <text x="494" y="282" fill="#4f5d75">en el worker</text>
          <text x="500" y="322" fill="#2d3142">4 handle: era,</text>
          <text x="500" y="338" fill="#4f5d75">_meta, nombre</text>
          <text x="570" y="378" fill="#2d3142">5 valida args</text>
          <text x="570" y="394" fill="#4f5d75">y ejecuta la tool</text>
          <text x="570" y="434" fill="#2d3142">6 dict o error</text>
          <text x="570" y="450" fill="#4f5d75">resultado</text>
          <text x="328" y="490" fill="#2d3142">7 reply(result)</text>
          <text x="328" y="506" fill="#4f5d75">máx. 40 000</text>
          <text x="166" y="546" fill="#2d3142">8 línea stdout</text>
          <text x="166" y="562" fill="#4f5d75">o HTTP 200</text>
        </g>

        <!-- key: the eight steps with their source lines -->
        <line x1="16" y1="620" x2="784" y2="620" stroke="#2d3142" stroke-opacity="0.2"/>
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="14" fill="#2d3142">
          <text x="16" y="644">1  tools/call: un mensaje JSON · stdio.py:38 · http_transport.py:143</text>
          <text x="16" y="664">2  worker.submit: cola de 64 como máximo · stdio.py:43 · http_transport.py:154</text>
          <text x="16" y="684">3  answer(message) en el worker · worker.py:72 · protocol.py:191</text>
          <text x="16" y="704">4  handle: era, _meta y nombre de la herramienta · protocol.py:100-105, 168-171</text>
          <text x="16" y="724">5  comprueba argumentos y ejecuta la herramienta · worker.py:155-158</text>
          <text x="16" y="744">6  un diccionario o un error · worker.py:159-168</text>
          <text x="16" y="764">7  reply(result): 40 000 caracteres como máximo · worker.py:72, 161-163</text>
          <text x="16" y="784">8  una línea en stdout o HTTP 200 · stdio.py:12 · http_transport.py:162</text>
        </g>

        <!-- legend and notes -->
        <rect x="16" y="804" width="24" height="14" rx="3" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1"/>
        <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">
          <text x="52" y="816">worker ocupado: del paso 3 al paso 7; la siguiente llamada espera en la cola</text>
          <text x="16" y="836">ping, tools/list y resto no van a la cola: el transporte llama a handle (stdio.py:45)</text>
          <text x="16" y="856">cancelar en stdio: el lector activa el evento de la llamada (worker.py:93)</text>
          <text x="16" y="876">cancelar en HTTP, era moderna: se cierra la conexión (http_transport.py:155-159)</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
