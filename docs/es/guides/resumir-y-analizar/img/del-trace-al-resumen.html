<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Del trace al resumen</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 760px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 700px; max-width: 100%; height: auto; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flujo · Diagrama</p>
    <h1>Del trace al resumen: exportar las tablas, contar los cuadros, escribir los archivos</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="at-title at-desc">
        <title id="at-title">Qué hace perf_report.py con un .trace</title>
        <desc id="at-desc">Ocho cajas en dos filas: exportar el índice y las tablas con xctrace; revisar el índice, donde la falta de metal-gpu-intervals es un error y las demás tablas ausentes van a missing_tables; leer el trabajo de GPU del programa lanzado; detectar el trabajo que nunca se presentó; luego los números por fotograma, las tablas opcionales, el ritmo y los hitches, y la escritura de los archivos.</desc>
        <defs>
          <marker id="at-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="at-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <text x="16" y="40" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75">Solo metal-gpu-intervals es obligatoria · las demás tablas son opcionales</text>

        <!-- arrows first, so the boxes sit above them -->
        <g stroke="#4f5d75" stroke-width="1.2" fill="none">
          <line x1="234" y1="184" x2="266" y2="184" marker-end="url(#at-arrow)"/>
          <line x1="484" y1="184" x2="516" y2="184" marker-end="url(#at-arrow)"/>
          <line x1="734" y1="184" x2="766" y2="184" marker-end="url(#at-arrow)"/>
          <line x1="875" y1="272" x2="875" y2="392" marker-end="url(#at-arrow)"/>
          <line x1="766" y1="480" x2="734" y2="480" marker-end="url(#at-arrow)"/>
          <line x1="516" y1="480" x2="484" y2="480" marker-end="url(#at-arrow)"/>
          <line x1="266" y1="480" x2="234" y2="480" marker-end="url(#at-arrow)"/>
          <path d="M294 272 V322 Q294 330 286 330 H120" marker-end="url(#at-arrow)"/>
          <path d="M456 272 V322 Q456 330 464 330 H800" marker-end="url(#at-arrow)"/>
        </g>

        <!-- row 1 -->
        <rect x="16" y="96" width="218" height="176" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <rect x="266" y="96" width="218" height="176" rx="6" fill="#f5f5f5"/>
        <rect x="266" y="96" width="218" height="176" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="5,4"/>
        <rect x="516" y="96" width="218" height="176" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <rect x="766" y="96" width="218" height="176" rx="6" fill="#f5f5f5" stroke="#2d3142"/>

        <!-- row 2 -->
        <rect x="16" y="392" width="218" height="176" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <rect x="266" y="392" width="218" height="176" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <rect x="516" y="392" width="218" height="176" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
        <rect x="766" y="392" width="218" height="176" rx="6" fill="#f5f5f5" stroke="#2d3142"/>

        <!-- branch labels: opaque masks, 10 px above the line -->
        <rect x="128" y="302" width="152" height="18" fill="#f5f5f5"/>
        <text x="204" y="316" text-anchor="middle" font-family="Geist Mono, monospace" font-size="16" fill="#5a6580">ausente: error</text>
        <rect x="470" y="302" width="312" height="18" fill="#f5f5f5"/>
        <text x="476" y="316" font-family="Geist Mono, monospace" font-size="16" fill="#5a6580">otras ausentes: missing_tables</text>

        <!-- row 1 text -->
        <g font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2d3142">
          <text x="28" y="126">1 · Exportar</text>
          <text x="28" y="147">índice y tablas</text>
          <text x="28" y="168">con xctrace</text>
          <text x="278" y="126">2 · Revisar el</text>
          <text x="278" y="147">índice (decisión)</text>
          <text x="528" y="126">3 · Leer el</text>
          <text x="528" y="147">trabajo de GPU</text>
          <text x="528" y="168">del programa</text>
          <text x="778" y="126">4 · Detectar</text>
          <text x="778" y="147">trabajo sin</text>
          <text x="778" y="168">presentar</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75">
          <text x="28" y="196">una tabla por xpath</text>
          <text x="28" y="216">de dos en dos</text>
          <text x="28" y="236">el XML temporal se</text>
          <text x="28" y="256">borra al leer</text>
          <text x="278" y="196">¿está metal-gpu-</text>
          <text x="278" y="216">intervals?</text>
          <text x="278" y="236">las demás ausentes:</text>
          <text x="278" y="256">→ missing_tables</text>
          <text x="528" y="196">filas del PID</text>
          <text x="528" y="216">lanzado, por cuadro</text>
          <text x="528" y="236">y canal; otros PID</text>
          <text x="528" y="256">aparte, ruidoso</text>
          <text x="778" y="196">un cuadro con 32+</text>
          <text x="778" y="216">command buffers</text>
          <text x="778" y="236">8 veces la mediana</text>
          <text x="778" y="256">y más de 1 s: fuera</text>
        </g>

        <!-- row 2 text -->
        <g font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2d3142">
          <text x="28" y="422">8 · Escribir los</text>
          <text x="28" y="443">archivos</text>
          <text x="278" y="422">7 · Ritmo y</text>
          <text x="278" y="443">hitches</text>
          <text x="528" y="422">6 · Tablas</text>
          <text x="528" y="443">opcionales</text>
          <text x="778" y="422">5 · Números</text>
          <text x="778" y="443">por fotograma</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75">
          <text x="28" y="492">frames.csv.gz y</text>
          <text x="28" y="512">bloque común, luego</text>
          <text x="28" y="532">el .json</text>
          <text x="28" y="552">añaden layer, tier</text>
          <text x="278" y="492">1 % y 0,1 % bajos</text>
          <text x="278" y="512">tirones, jitter,</text>
          <text x="278" y="532">throttling; una</text>
          <text x="278" y="552">causa por cuadro</text>
          <text x="528" y="492">memoria, RSS, reloj</text>
          <text x="528" y="512">térmica, compilador</text>
          <text x="528" y="532">CPU, asignaciones,</text>
          <text x="528" y="552">errores, contadores</text>
          <text x="778" y="492">frame_gpu_ms por</text>
          <text x="778" y="512">canal, intervalo</text>
          <text x="778" y="532">entre cuadros</text>
          <text x="778" y="552">fps: 1000 / mediana</text>
        </g>

        <!-- legend -->
        <line x1="16" y1="592" x2="984" y2="592" stroke="#2d3142" stroke-opacity="0.2"/>
        <rect x="16" y="606" width="24" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/>
        <text x="52" y="618" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75">decisión</text>
        <text x="200" y="618" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75">las filas van de izquierda a derecha; la de abajo, de derecha a izquierda</text>
      </svg>
    </div>
  </div>
</body>
</html>
