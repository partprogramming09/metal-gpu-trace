<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivos de una corrida y lo que borra cada poda</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; max-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Matriz · Diagram Design</p>
    <h1>Los archivos de una corrida y lo que borra cada poda</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-files-per-run-title data-files-per-run-desc">
        <title id="data-files-per-run-title">Archivos de una corrida y lo que borra cada poda</title>
        <desc id="data-files-per-run-desc">Tabla con una fila por tipo de archivo de una corrida y cuatro columnas: quién lo escribe, qué pasa al terminar la corrida, qué hace KEEP_RUNS y qué hace METAL_TRACE_MAX_DISK_MB. Las celdas sombreadas son las que pueden borrar el archivo; el resumen .json solo lo borra KEEP_RUNS, el .trace solo la cuota, y baselines.json y la marca de la carpeta nunca se borran.</desc>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- cabecera -->
        <g font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2d3142">
          <text x="28" y="140">Archivo</text>
          <text x="264" y="140">Escrito por</text>
          <text x="472" y="120">Fin de una</text>
          <text x="472" y="140">corrida</text>
          <text x="672" y="100" font-family="Geist Mono, monospace">KEEP_RUNS=N</text>
          <text x="672" y="120">corridas</text>
          <text x="672" y="140">antiguas</text>
          <text x="816" y="120" font-family="Geist Mono, monospace">METAL_TRACE_</text>
          <text x="816" y="140" font-family="Geist Mono, monospace">MAX_DISK_MB</text>
        </g>
        <line x1="24" y1="152" x2="976" y2="152" stroke="#2d3142" stroke-width="1"/>

        <!-- sombreado: el archivo puede borrarse en esa celda -->
        <g fill="rgba(45,49,66,0.08)">
          <rect x="464" y="164" width="184" height="48"/>
          <rect x="808" y="164" width="168" height="48"/>
          <rect x="664" y="276" width="128" height="72"/>
          <rect x="808" y="276" width="168" height="72"/>
          <rect x="664" y="356" width="128" height="48"/>
          <rect x="664" y="412" width="128" height="48"/>
          <rect x="808" y="412" width="168" height="48"/>
          <rect x="664" y="468" width="128" height="48"/>
        </g>
        <!-- acento: la única celda donde KEEP_RUNS borra un resumen -->
        <rect x="664" y="220" width="128" height="48" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>

        <g stroke="#2d3142" stroke-opacity="0.2" stroke-width="1">
          <line x1="24" y1="216" x2="976" y2="216"/>
          <line x1="24" y1="272" x2="976" y2="272"/>
          <line x1="24" y1="352" x2="976" y2="352"/>
          <line x1="24" y1="408" x2="976" y2="408"/>
          <line x1="24" y1="464" x2="976" y2="464"/>
          <line x1="24" y1="520" x2="976" y2="520"/>
          <line x1="24" y1="576" x2="976" y2="576"/>
        </g>
        <line x1="24" y1="632" x2="976" y2="632" stroke="#2d3142" stroke-width="1"/>

        <!-- fila 1: .trace -->
        <g font-size="16" fill="#2d3142">
          <text x="28" y="193" font-family="Geist Mono, monospace" font-weight="600">&lt;run&gt;.trace</text>
          <text x="264" y="193" font-family="Geist Mono, monospace">xctrace</text>
          <text x="472" y="183" font-family="Geist, system-ui, sans-serif">Se borra, salvo</text>
          <text x="472" y="203" font-family="Geist Mono, monospace">KEEP_TRACE=1</text>
          <text x="672" y="183" font-family="Geist, system-ui, sans-serif">No lo borra</text>
          <text x="672" y="203" font-family="Geist Mono, monospace">KEEP_RUNS</text>
          <text x="816" y="183" font-family="Geist, system-ui, sans-serif">1.º en la</text>
          <text x="816" y="203" font-family="Geist, system-ui, sans-serif">cuota</text>
        </g>

        <!-- fila 2: .json -->
        <g font-size="16" fill="#2d3142">
          <text x="28" y="249" font-family="Geist Mono, monospace" font-weight="600">&lt;run&gt;.json</text>
          <text x="264" y="239" font-family="Geist Mono, monospace">perf_report.py</text>
          <text x="264" y="259" font-family="Geist Mono, monospace">y recording.py</text>
          <text x="472" y="249" font-family="Geist, system-ui, sans-serif">Se conserva</text>
          <text x="672" y="239" font-family="Geist, system-ui, sans-serif" font-weight="600">Con su</text>
          <text x="672" y="259" font-family="Geist, system-ui, sans-serif" font-weight="600">corrida</text>
          <text x="816" y="249" font-family="Geist, system-ui, sans-serif">Nunca</text>
        </g>

        <!-- fila 3: tablas -->
        <g font-size="16" fill="#2d3142">
          <text x="28" y="294" font-family="Geist Mono, monospace" font-weight="600">&lt;run&gt;.frames.csv.gz</text>
          <text x="28" y="314" font-family="Geist Mono, monospace" font-weight="600">&lt;run&gt;.metal_memory</text>
          <text x="28" y="334" font-family="Geist Mono, monospace" font-weight="600">.csv.gz</text>
          <text x="264" y="294" font-family="Geist Mono, monospace">perf_report.py</text>
          <text x="264" y="314" font-family="Geist, system-ui, sans-serif" fill="#4f5d75">(macOS)</text>
          <text x="472" y="312" font-family="Geist, system-ui, sans-serif">Se conservan</text>
          <text x="672" y="302" font-family="Geist, system-ui, sans-serif">Con su</text>
          <text x="672" y="322" font-family="Geist, system-ui, sans-serif">corrida</text>
          <text x="816" y="302" font-family="Geist, system-ui, sans-serif">3.º en la</text>
          <text x="816" y="322" font-family="Geist, system-ui, sans-serif">cuota</text>
        </g>

        <!-- fila 4: muestreadores -->
        <g font-size="16" fill="#2d3142">
          <text x="28" y="375" font-family="Geist Mono, monospace" font-weight="600">&lt;run&gt;.rss.csv</text>
          <text x="28" y="395" font-family="Geist Mono, monospace" font-weight="600">&lt;run&gt;.agx.csv</text>
          <text x="264" y="385" font-family="Geist Mono, monospace">perf_record.sh</text>
          <text x="472" y="385" font-family="Geist, system-ui, sans-serif">Se conservan</text>
          <text x="672" y="375" font-family="Geist, system-ui, sans-serif">Con su</text>
          <text x="672" y="395" font-family="Geist, system-ui, sans-serif">corrida</text>
          <text x="816" y="385" font-family="Geist, system-ui, sans-serif">Nunca</text>
        </g>

        <!-- fila 5: chrome-trace -->
        <g font-size="16" fill="#2d3142">
          <text x="28" y="441" font-family="Geist Mono, monospace" font-weight="600">&lt;run&gt;.chrome-trace</text>
          <text x="264" y="441" font-family="Geist Mono, monospace">traces.py</text>
          <text x="472" y="441" font-family="Geist, system-ui, sans-serif">Solo si se pide</text>
          <text x="672" y="431" font-family="Geist, system-ui, sans-serif">Con su</text>
          <text x="672" y="451" font-family="Geist, system-ui, sans-serif">corrida</text>
          <text x="816" y="431" font-family="Geist, system-ui, sans-serif">2.º en la</text>
          <text x="816" y="451" font-family="Geist, system-ui, sans-serif">cuota</text>
        </g>

        <!-- fila 6: presentmon -->
        <g font-size="16" fill="#2d3142">
          <text x="28" y="487" font-family="Geist Mono, monospace" font-weight="600">.presentmon.csv</text>
          <text x="28" y="507" font-family="Geist, system-ui, sans-serif" fill="#4f5d75">(solo Windows)</text>
          <text x="264" y="487" font-family="Geist Mono, monospace">perf_record_</text>
          <text x="264" y="507" font-family="Geist Mono, monospace">windows.py</text>
          <text x="472" y="497" font-family="Geist, system-ui, sans-serif">Se conserva</text>
          <text x="672" y="487" font-family="Geist, system-ui, sans-serif">Con su</text>
          <text x="672" y="507" font-family="Geist, system-ui, sans-serif">corrida</text>
          <text x="816" y="487" font-family="Geist, system-ui, sans-serif">Nunca</text>
          <text x="816" y="507" font-family="Geist, system-ui, sans-serif" fill="#4f5d75">(sin cuota)</text>
        </g>

        <!-- fila 7: baselines -->
        <g font-size="16" fill="#2d3142">
          <text x="28" y="553" font-family="Geist Mono, monospace" font-weight="600">baselines.json</text>
          <text x="264" y="553" font-family="Geist Mono, monospace">analysis.py</text>
          <text x="472" y="553" font-family="Geist, system-ui, sans-serif">Se conserva</text>
          <text x="672" y="553" font-family="Geist, system-ui, sans-serif">Nunca</text>
          <text x="816" y="553" font-family="Geist, system-ui, sans-serif">Nunca</text>
        </g>

        <!-- fila 8: marca -->
        <g font-size="16" fill="#2d3142">
          <text x="28" y="609" font-family="Geist Mono, monospace" font-weight="600">.metal-gpu-trace-runs</text>
          <text x="264" y="609" font-family="Geist Mono, monospace">project.py</text>
          <text x="472" y="609" font-family="Geist, system-ui, sans-serif">Se conserva</text>
          <text x="672" y="609" font-family="Geist, system-ui, sans-serif">Nunca</text>
          <text x="816" y="609" font-family="Geist, system-ui, sans-serif">Nunca</text>
        </g>

        <!-- leyenda -->
        <rect x="24" y="652" width="24" height="14" fill="rgba(45,49,66,0.08)"/>
        <text x="56" y="664" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#4f5d75">se puede borrar aquí</text>
        <rect x="300" y="652" width="24" height="14" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
        <text x="332" y="664" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#4f5d75">única forma de borrar un resumen</text>
        <text x="24" y="692" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#4f5d75">Orden de la cuota: 1.º .trace, 2.º .chrome-trace, 3.º tablas</text>
      </svg>
    </div>
  </div>
</body>
</html>
