<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De una grabación a disco, con el candado</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; max-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Secuencia · Diagram Design</p>
    <h1>De una grabación a disco: quién escribe qué, y cuándo está tomado el candado</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-recording-to-disk-title data-recording-to-disk-desc">
        <title id="data-recording-to-disk-title">Una grabación desde el primer control hasta el disco</title>
        <desc id="data-recording-to-disk-desc">Cinco actores: el servidor recording.py, el candado, el script perf_record.sh, el informe perf_report.py y la carpeta de corridas. Ocho pasos numerados: el candado se toma en el paso 2 y se suelta en el 7, y el resumen se escribe en los pasos 5 y 8.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- banda: el candado tomado, del paso 2 al 7 -->
        <rect x="292" y="278" width="16" height="308" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4"/>

        <!-- líneas de vida -->
        <g stroke="#2d3142" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3,4">
          <line x1="100" y1="172" x2="100" y2="652"/>
          <line x1="300" y1="172" x2="300" y2="652"/>
          <line x1="500" y1="172" x2="500" y2="652"/>
          <line x1="700" y1="172" x2="700" y2="652"/>
          <line x1="900" y1="172" x2="900" y2="652"/>
        </g>

        <!-- actores -->
        <g fill="#f5f5f5" stroke="#2d3142" stroke-width="1">
          <rect x="16" y="84" width="168" height="88" rx="6"/>
          <rect x="216" y="84" width="168" height="88" rx="6"/>
          <rect x="416" y="84" width="168" height="88" rx="6"/>
          <rect x="616" y="84" width="168" height="88" rx="6"/>
          <rect x="816" y="84" width="168" height="88" rx="6"/>
        </g>
        <g font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">
          <text x="100" y="118">Servidor MCP</text>
          <text x="300" y="118">Candado</text>
          <text x="500" y="118">Script</text>
          <text x="700" y="118">Informe</text>
          <text x="900" y="108">Carpeta de</text>
          <text x="900" y="130">corridas</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75" text-anchor="middle">
          <text x="100" y="144">recording.py</text>
          <text x="300" y="144">recording.lock</text>
          <text x="500" y="144">perf_record.sh</text>
          <text x="700" y="144">perf_report.py</text>
          <text x="900" y="152">perf-runs/</text>
        </g>

        <!-- flechas: una por paso -->
        <g stroke="#4f5d75" stroke-width="1.2" fill="none">
          <line x1="100" y1="236" x2="300" y2="236" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <line x1="500" y1="292" x2="300" y2="292" marker-end="url(#arrow)"/>
          <line x1="500" y1="348" x2="900" y2="348" marker-end="url(#arrow)"/>
          <line x1="500" y1="404" x2="700" y2="404" marker-end="url(#arrow)"/>
        </g>
        <line x1="700" y1="460" x2="900" y2="460" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <g stroke="#4f5d75" stroke-width="1.2" fill="none">
          <line x1="500" y1="516" x2="900" y2="516" marker-end="url(#arrow)"/>
          <line x1="500" y1="572" x2="300" y2="572" marker-end="url(#arrow)"/>
        </g>
        <line x1="100" y1="628" x2="900" y2="628" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

        <!-- etiquetas: encima de cada flecha, con máscara opaca y hueco de 8 px -->
        <rect x="102" y="194" width="196" height="34" fill="#f5f5f5"/>
        <text x="200" y="208" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#2d3142" text-anchor="middle">1 lee el candado</text>
        <text x="200" y="224" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75" text-anchor="middle">preflight.py:74-98</text>

        <rect x="310" y="250" width="180" height="34" fill="#f5f5f5"/>
        <text x="400" y="264" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#2d3142" text-anchor="middle">2 toma el candado</text>
        <text x="400" y="280" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75" text-anchor="middle">perf_record.sh</text>

        <rect x="562" y="306" width="276" height="34" fill="#f5f5f5"/>
        <text x="700" y="320" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#2d3142" text-anchor="middle">3 escribe muestras y .trace</text>
        <text x="700" y="336" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75" text-anchor="middle">perf_record.sh:104-151</text>

        <rect x="502" y="362" width="196" height="34" fill="#f5f5f5"/>
        <text x="600" y="376" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#2d3142" text-anchor="middle">4 lanza el informe</text>
        <text x="600" y="392" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75" text-anchor="middle">perf_record.sh:160</text>

        <rect x="682" y="418" width="236" height="34" fill="#f5f5f5"/>
        <text x="800" y="432" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#2d3142" text-anchor="middle">5 tablas y primer .json</text>
        <text x="800" y="448" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75" text-anchor="middle">perf_report.py:745</text>

        <rect x="567" y="474" width="266" height="34" fill="#f5f5f5"/>
        <text x="700" y="488" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#2d3142" text-anchor="middle">6 borra .trace y KEEP_RUNS</text>
        <text x="700" y="504" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75" text-anchor="middle">perf_record.sh:163-164</text>

        <rect x="315" y="530" width="170" height="34" fill="#f5f5f5"/>
        <text x="400" y="544" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#2d3142" text-anchor="middle">7 libera candado</text>
        <text x="400" y="560" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75" text-anchor="middle">perf_record.sh</text>

        <rect x="393" y="586" width="214" height="34" fill="#f5f5f5"/>
        <text x="500" y="600" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#bf4520" text-anchor="middle">8 reescribe .json</text>
        <text x="500" y="616" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75" text-anchor="middle">recording.py:341-350</text>

        <!-- nombre de la banda -->
        <rect x="228" y="588" width="144" height="24" fill="#f5f5f5"/>
        <text x="300" y="605" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#bf4520" text-anchor="middle">candado tomado</text>

        <!-- leyenda -->
        <line x1="24" y1="668" x2="976" y2="668" stroke="#2d3142" stroke-opacity="0.2" stroke-width="1"/>
        <rect x="24" y="678" width="24" height="14" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/>
        <text x="56" y="690" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#4f5d75">candado tomado (pasos 2 a 7)</text>
        <text x="380" y="690" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#4f5d75">línea discontinua: solo lectura</text>
        <text x="24" y="714" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#4f5d75">Lanzada a mano (perf_record.sh solo): sin pasos 1 y 8, así que sin límite de disco</text>
        <text x="24" y="738" font-family="Geist, system-ui, sans-serif" font-size="16" fill="#4f5d75">Paso 8: añade layer, context y tier; aplica el límite de disco si no hay otra grabación</text>
      </svg>
    </div>
  </div>
</body>
</html>
