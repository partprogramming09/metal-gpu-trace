<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tres formas de leer una grabación, y dónde se detiene cada una</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    /* The diagram is drawn at 800 units and shown at 700 px. */
    svg { width: 700px; min-width: 700px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flujo · Diagrama</p>
    <h1>Tres formas de leer una grabación, y dónde se detiene cada una</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 800 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tres-formas-title tres-formas-desc">
        <title id="tres-formas-title">Tres formas de leer una grabación, y dónde se detiene cada una</title>
        <desc id="tres-formas-desc">Tres filas de tres pasos de izquierda a derecha: un .trace leído con trace_tables, trace_count y trace_query; un .gputrace leído con capture_summary, capture_diff y capture_records; y la tabla por fotograma de una corrida, exportada con perf_export_trace. En cada fila, un paso marca con color de acento dónde se detiene con un error.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- row labels -->
        <g font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#4f5d75">
          <text x="16" y="30">.trace (Instruments): trace_tables, trace_count, trace_query</text>
          <text x="16" y="196">.gputrace (captura de Xcode): capture_summary, capture_diff, capture_records</text>
          <text x="16" y="362">tabla por fotograma de una corrida: perf_export_trace</text>
        </g>

        <!-- arrows, drawn before boxes -->
        <g stroke="#4f5d75" stroke-width="1.2" fill="none">
          <line x1="248" y1="104" x2="280" y2="104" marker-end="url(#arrow)"/>
          <line x1="516" y1="104" x2="548" y2="104" marker-end="url(#arrow)"/>
          <line x1="248" y1="270" x2="280" y2="270" marker-end="url(#arrow)"/>
          <line x1="516" y1="270" x2="548" y2="270" marker-end="url(#arrow)"/>
          <line x1="248" y1="436" x2="280" y2="436" marker-end="url(#arrow)"/>
          <line x1="516" y1="436" x2="548" y2="436" marker-end="url(#arrow)"/>
        </g>

        <!-- row 1: .trace -->
        <rect x="16" y="44" width="232" height="120" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
        <rect x="284" y="44" width="232" height="120" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.5"/>
        <rect x="552" y="44" width="232" height="120" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>

        <!-- row 2: .gputrace -->
        <rect x="16" y="210" width="232" height="120" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
        <rect x="284" y="210" width="232" height="120" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.5"/>
        <rect x="552" y="210" width="232" height="120" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>

        <!-- row 3: perf_export_trace -->
        <rect x="16" y="376" width="232" height="120" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.5"/>
        <rect x="284" y="376" width="232" height="120" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
        <rect x="552" y="376" width="232" height="120" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>

        <!-- row 1 text -->
        <g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">
          <text x="28" y="70">1 · Buscar la traza</text>
          <text x="296" y="70">2 · Exportar una tabla</text>
          <text x="564" y="70">3 · Filtrar y devolver</text>
        </g>
        <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">
          <text x="28" y="94">nombre de corrida o ruta</text>
          <text x="296" y="94">xctrace, una tabla a XML</text>
          <text x="564" y="94">filas o ventanas</text>
        </g>
        <g font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#bf4520">
          <text x="296" y="120">para: FileNotFoundError</text>
        </g>
        <g font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#4f5d75">
          <text x="28" y="146">traces.py:98-101</text>
          <text x="296" y="146">perf_report.py:49-66</text>
          <text x="564" y="146">traces.py:92-114</text>
        </g>

        <!-- row 2 text -->
        <g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">
          <text x="28" y="236">1 · Resolver el paquete</text>
          <text x="296" y="236">2 · Partir el archivo</text>
          <text x="564" y="236">3 · Contar o listar</text>
        </g>
        <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">
          <text x="28" y="260">dentro de las carpetas</text>
          <text x="296" y="260">cabecera de 8 bytes</text>
          <text x="564" y="260">resumen, diff o página</text>
        </g>
        <g font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#bf4520">
          <text x="296" y="286">para: ValueError</text>
        </g>
        <g font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#4f5d75">
          <text x="28" y="312">paths.py:17-22</text>
          <text x="296" y="312">gputrace_read.py:48-60</text>
          <text x="564" y="312">gputrace_read.py:72-141</text>
        </g>

        <!-- row 3 text -->
        <g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">
          <text x="28" y="402">1 · Buscar la tabla</text>
          <text x="296" y="402">2 · Rebanar fotogramas</text>
          <text x="564" y="402">3 · Escribir el archivo</text>
        </g>
        <g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">
          <text x="28" y="426">tabla por fotograma</text>
          <text x="296" y="426">ts y dur en µs</text>
          <text x="564" y="426">nombre y fotogramas</text>
        </g>
        <g font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#bf4520">
          <text x="28" y="452">para: ToolError</text>
        </g>
        <g font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#4f5d75">
          <text x="28" y="478">traces.py:14-17</text>
          <text x="296" y="478">traces.py:18-27</text>
          <text x="564" y="478">traces.py:28-30</text>
        </g>

        <!-- legend -->
        <line x1="16" y1="510" x2="784" y2="510" stroke="#2d3142" stroke-opacity="0.2"/>
        <rect x="16" y="526" width="28" height="14" rx="3" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.5"/>
        <g font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#4f5d75">
          <text x="56" y="538">dónde se detiene el paso (el error)</text>
          <text x="16" y="564">cada error vuelve como texto: worker.py:165-168</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
