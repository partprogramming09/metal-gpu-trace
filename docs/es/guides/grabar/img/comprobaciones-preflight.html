<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprobaciones antes de grabar</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;padding:2rem;display:flex;justify-content:center}
svg{width:700px;max-width:100%;height:auto;display:block}
@media print{svg{width:100%}}
</style>
</head>
<body>
<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comprobaciones-preflight-title comprobaciones-preflight-desc">
<title id="comprobaciones-preflight-title">Comprobaciones antes de grabar</title>
<desc id="comprobaciones-preflight-desc">Siete cajas en fila: argumentos, programa, xcrun, disco, pantalla, candado y empezar a grabar. Las seis primeras pueden rechazar la grabación, y bajo cada una está el mensaje con que lo hace.</desc>
<defs>
<marker id="pf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="pf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="1000" height="200" fill="#f5f5f5"/>

<!-- arrows first, so boxes sit on top -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="118" y1="100" x2="162" y2="100" marker-end="url(#pf-arrow)"/>
<line x1="262" y1="100" x2="306" y2="100" marker-end="url(#pf-arrow)"/>
<line x1="406" y1="100" x2="450" y2="100" marker-end="url(#pf-arrow)"/>
<line x1="550" y1="100" x2="594" y2="100" marker-end="url(#pf-arrow)"/>
<line x1="694" y1="100" x2="738" y2="100" marker-end="url(#pf-arrow)"/>
</g>
<line x1="838" y1="100" x2="882" y2="100" stroke="#bf4520" stroke-width="1.2" marker-end="url(#pf-arrow-accent)"/>

<!-- arrow labels: opaque mask, 8 px above the line -->
<g fill="#f5f5f5">
<rect x="120" y="72" width="40" height="20" rx="2"/>
<rect x="264" y="72" width="40" height="20" rx="2"/>
<rect x="408" y="72" width="40" height="20" rx="2"/>
<rect x="552" y="72" width="40" height="20" rx="2"/>
<rect x="696" y="72" width="40" height="20" rx="2"/>
<rect x="840" y="72" width="40" height="20" rx="2"/>
</g>
<g font-family="Geist, system-ui, sans-serif" font-size="16" fill="#5a6580" text-anchor="middle">
<text x="140" y="88">pasa</text>
<text x="284" y="88">pasa</text>
<text x="428" y="88">pasa</text>
<text x="572" y="88">pasa</text>
<text x="716" y="88">pasa</text>
<text x="860" y="88">pasa</text>
</g>

<!-- boxes -->
<rect x="18" y="60" width="100" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="162" y="60" width="100" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="306" y="60" width="100" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="450" y="60" width="100" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="594" y="60" width="100" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="738" y="60" width="100" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="882" y="60" width="100" height="80" rx="6" fill="#f5f5f5"/>
<rect x="882" y="60" width="100" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>

<g font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">
<text x="68" y="106">Argumentos</text>
<text x="212" y="106">Programa</text>
<text x="356" y="106">xcrun</text>
<text x="500" y="106">Disco</text>
<text x="644" y="106">Pantalla</text>
<text x="788" y="106">Candado</text>
<text x="932" y="95">Empezar a</text>
<text x="932" y="113">grabar</text>
</g>

<!-- refusal messages, one per check -->
<g font-family="Geist Mono, ui-monospace, monospace" font-size="16" fill="#4f5d75" text-anchor="middle">
<text x="68" y="162">segundos</text>
<text x="68" y="180">de 1 a 3600</text>
<text x="212" y="162">sin Wine o</text>
<text x="212" y="180">no ejecutable</text>
<text x="356" y="162">falta xcrun:</text>
<text x="356" y="180">instala Xcode</text>
<text x="500" y="162">poco disco</text>
<text x="500" y="180">libre</text>
<text x="644" y="162">pantalla</text>
<text x="644" y="180">bloqueada</text>
<text x="788" y="162">ya hay otra</text>
<text x="788" y="180">grabación</text>
</g>
</svg>
</body>
</html>
