<!DOCTYPE html>

<body>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="motor-windows-title motor-windows-desc">
<title id="motor-windows-title">Motor de Windows: una grabación</title>
<desc id="motor-windows-desc">Ocho cajas en dos filas. Arriba: candado, programa, fuente de fotogramas (una decisión) y bucle de un segundo. Abajo: parar y limpiar, qué fotogramas (una decisión), escribir y recording.finish.</desc>

<marker id="mw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="800" height="400" fill="#f5f5f5"/>

<!-- arrows first, so boxes sit on top -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="166" y1="144" x2="218" y2="144" marker-end="url(#mw-arrow)"/>
<line x1="374" y1="144" x2="426" y2="144" marker-end="url(#mw-arrow)"/>
<line x1="582" y1="144" x2="634" y2="144" marker-end="url(#mw-arrow)"/>
<path d="M712 192 V216 A8 8 0 0 1 704 224 H96 A8 8 0 0 0 88 232 V256" marker-end="url(#mw-arrow)"/>

</g>
<line x1="166" y1="316" x2="218" y2="316" stroke="#bf4520" stroke-width="1.2" marker-end="url(#mw-arrow-accent)"/>

<!-- row 1 -->
<rect x="10" y="96" width="156" height="96" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="218" y="96" width="156" height="96" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="426" y="96" width="156" height="96" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4"/>
<rect x="634" y="96" width="156" height="96" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">

</g>

<text x="88" y="158">mkdir y pid</text>
<text x="296" y="158">Popen o attach</text>
<text x="504" y="158">PresentMon /</text>
<text x="504" y="176">hilo DWM</text>
<text x="712" y="158">RSS y cancelar</text>
</g>

<rect x="10" y="256" width="156" height="120" rx="6" fill="#f5f5f5" stroke="#2d3142"/>

<text x="296" y="339">dwm-composition</text>
<text x="296" y="357">ninguno</text>
</g>
<text x="504" y="330" font-family="Geist Mono, ui-monospace, monospace" font-size="14" fill="#4f5d75" text-anchor="middle">frames.csv.gz</text>
