<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El recorrido de una grabación en macOS</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;padding:2rem;display:flex;justify-content:center}
svg{width:700px;max-width:100%;height:auto;display:block}
@media print{svg{width:100%}}
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="recorrido-macos-title recorrido-macos-desc">
<title id="recorrido-macos-title">El recorrido de una grabación en macOS</title>
<desc id="recorrido-macos-desc">Siete cajas en un recorrido de petición a respuesta, con el bucle de vigilancia de cada segundo. Desde el bucle, si se cancela o se pasa del plazo, la grabación baja a un cierre forzado que borra los archivos nuevos y no guarda nada.</desc>
<defs>
<marker id="rm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="rm-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="800" height="500" fill="#f5f5f5"/>

<!-- arrows first, so boxes sit on top -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="166" y1="138" x2="218" y2="138" marker-end="url(#rm-arrow)"/>
<line x1="374" y1="138" x2="426" y2="138" marker-end="url(#rm-arrow)"/>
<line x1="582" y1="138" x2="634" y2="138" marker-end="url(#rm-arrow)"/>
<line x1="712" y1="180" x2="712" y2="240" marker-end="url(#rm-arrow)"/>
<line x1="634" y1="282" x2="582" y2="282" marker-end="url(#rm-arrow)"/>
<line x1="426" y1="282" x2="374" y2="282" marker-end="url(#rm-arrow)"/>
</g>
<line x1="712" y1="324" x2="712" y2="384" stroke="#bf4520" stroke-width="1.2" marker-end="url(#rm-arrow-accent)"/>

<!-- row 1: petición, herramientas, envoltorio, script -->
<rect x="10" y="96" width="156" height="84" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="218" y="96" width="156" height="84" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="426" y="96" width="156" height="84" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="634" y="96" width="156" height="84" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<!-- row 2, right to left: respuesta, terminar, bucle -->
<rect x="218" y="240" width="156" height="84" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="426" y="240" width="156" height="84" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="634" y="240" width="156" height="84" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<!-- row 3: cierre forzado, the accent -->
<rect x="634" y="384" width="156" height="96" rx="6" fill="#f5f5f5"/>
<rect x="634" y="384" width="156" height="96" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>

<g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">
<text x="88" y="143">Petición</text>
<text x="296" y="134">Comprobación de</text>
<text x="296" y="152">herramientas</text>
<text x="504" y="134">Envoltorio</text>
<text x="712" y="125">Script</text>
<text x="296" y="287">Respuesta</text>
<text x="504" y="287">Terminar</text>
<text x="712" y="269">Bucle de</text>
<text x="712" y="287">vigilancia</text>
<text x="712" y="410">Cierre forzado</text>
</g>
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75" text-anchor="middle">
<text x="504" y="152">(preflight)</text>
<text x="712" y="143">(su propio grupo</text>
<text x="712" y="161">de procesos)</text>
<text x="712" y="305">(1 s)</text>
</g>
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle">
<text x="712" y="428">borra los</text>
<text x="712" y="446">archivos nuevos,</text>
<text x="712" y="464">no se guarda nada</text>
</g>

<!-- branch label, beside the vertical segment, on an opaque mask -->
<rect x="552" y="336" width="152" height="38" rx="2" fill="#f5f5f5"/>
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#5a6580" text-anchor="end">
<text x="700" y="350">cancelar o</text>
<text x="700" y="366">pasarse de tiempo</text>
</g>
</svg>
</body>
</html>
