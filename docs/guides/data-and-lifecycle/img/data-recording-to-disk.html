<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From a recording to disk, with the lock</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    /* Rendered at 700 px on the page: a 1000-unit viewBox at 0.7 scale. */
    .frame { max-width: 700px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 0; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>From a recording to disk: who writes what, and when the lock is held</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-recording-to-disk-title data-recording-to-disk-desc">
        <title id="data-recording-to-disk-title">A recording on macOS, from the first check to the files on disk</title>
        <desc id="data-recording-to-disk-desc">Five actors: the MCP server, the lock, the script perf_record.sh, the report perf_report.py and the runs folder. Eight numbered steps: the server checks the lock; the script takes it; the script and Instruments write the samplers and the trace; the script starts the report; the report writes the tables and a first summary; the script deletes the trace and applies KEEP_RUNS; the script frees the lock; the server finishes, applies the disk limit and rewrites the summary. The lock is held from step 2 to step 7.</desc>
        <defs>
          <marker id="drd-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="drd-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- lifelines: centres 100, 300, 500, 700, 900 -->
        <g stroke="#2d3142" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3,4">
          <line x1="100" y1="130" x2="100" y2="640"/>
          <line x1="300" y1="130" x2="300" y2="640"/>
          <line x1="500" y1="130" x2="500" y2="640"/>
          <line x1="700" y1="130" x2="700" y2="640"/>
          <line x1="900" y1="130" x2="900" y2="640"/>
        </g>

        <!-- lock-held band: steps 2 to 7 on the Lock lifeline -->
        <rect x="285" y="248" width="30" height="290" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/>

        <!-- actor boxes -->
        <g font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">
          <rect x="22" y="70" width="156" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
          <text x="100" y="96">MCP server</text>
          <text x="100" y="118" font-family="Geist Mono, monospace" font-weight="400" fill="#4f5d75">recording.py</text>

          <rect x="222" y="70" width="156" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
          <text x="300" y="96">Lock</text>
          <text x="300" y="118" font-family="Geist Mono, monospace" font-weight="400" fill="#4f5d75">recording.lock</text>

          <rect x="422" y="70" width="156" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
          <text x="500" y="96">Script</text>
          <text x="500" y="118" font-family="Geist Mono, monospace" font-weight="400" fill="#4f5d75">perf_record.sh</text>

          <rect x="622" y="70" width="156" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
          <text x="700" y="96">Report</text>
          <text x="700" y="118" font-family="Geist Mono, monospace" font-weight="400" fill="#4f5d75">perf_report.py</text>

          <rect x="822" y="70" width="156" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
          <text x="900" y="96">Runs folder</text>
          <text x="900" y="118" font-family="Geist Mono, monospace" font-weight="400" fill="#4f5d75">perf-runs/</text>
        </g>

        <!-- messages: arrows first, then their labels with paper masks -->
        <g stroke="#4f5d75" stroke-width="1.2" fill="none">
          <line x1="100" y1="190" x2="300" y2="190" marker-end="url(#drd-arrow)" stroke-dasharray="5,4"/>
          <line x1="500" y1="248" x2="300" y2="248" marker-end="url(#drd-arrow)"/>
          <line x1="500" y1="306" x2="900" y2="306" marker-end="url(#drd-arrow)"/>
          <line x1="500" y1="364" x2="700" y2="364" marker-end="url(#drd-arrow)"/>
          <line x1="700" y1="422" x2="900" y2="422" stroke="#bf4520" marker-end="url(#drd-arrow-accent)"/>
          <line x1="500" y1="480" x2="900" y2="480" marker-end="url(#drd-arrow)"/>
          <line x1="500" y1="538" x2="300" y2="538" marker-end="url(#drd-arrow)"/>
          <line x1="900" y1="596" x2="100" y2="596" stroke="#bf4520" marker-end="url(#drd-arrow-accent)"/>
        </g>

        <g font-family="Geist Mono, monospace" font-size="16" fill="#f5f5f5">
          <rect x="141" y="162" width="118" height="22" rx="2" fill="#f5f5f5"/>
          <rect x="282" y="220" width="236" height="22" rx="2" fill="#f5f5f5"/>
          <rect x="602" y="278" width="197" height="22" rx="2" fill="#f5f5f5"/>
          <rect x="512" y="336" width="177" height="22" rx="2" fill="#f5f5f5"/>
          <rect x="692" y="394" width="216" height="22" rx="2" fill="#f5f5f5"/>
          <rect x="587" y="452" width="226" height="22" rx="2" fill="#f5f5f5"/>
          <rect x="352" y="510" width="97" height="22" rx="2" fill="#f5f5f5"/>
          <rect x="382" y="568" width="236" height="22" rx="2" fill="#f5f5f5"/>
        </g>
        <g font-family="Geist Mono, monospace" font-size="16" fill="#2d3142" text-anchor="middle">
          <text x="200" y="178">1 check pid</text>
          <text x="400" y="236">2 mkdir lock, write pid</text>
          <text x="700" y="294">3 samplers + .trace</text>
          <text x="600" y="352">4 run perf_report</text>
          <text x="800" y="410" fill="#bf4520" font-weight="600">5 tables, first .json</text>
          <text x="700" y="468">6 rm .trace, KEEP_RUNS</text>
          <text x="400" y="526">7 rm lock</text>
          <text x="500" y="584" fill="#bf4520" font-weight="600">8 finish: rewrite .json</text>
        </g>

        <!-- legend -->
        <line x1="24" y1="664" x2="976" y2="664" stroke="#2d3142" stroke-opacity="0.2"/>
        <rect x="24" y="686" width="28" height="16" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/>
        <text x="64" y="700" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75">lock held, steps 2 to 7</text>
        <rect x="340" y="686" width="28" height="16" fill="none" stroke="#bf4520" stroke-width="1.5"/>
        <text x="380" y="700" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75">accent: steps 5 and 8</text>
        <line x1="620" y1="694" x2="660" y2="694" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#drd-arrow)"/>
        <text x="672" y="700" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75">dashed = read only</text>
        <text x="24" y="736" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75">run by hand (perf_record.sh alone): no steps 1 and 8, so no disk limit</text>
        <text x="24" y="768" font-family="Geist Mono, monospace" font-size="16" fill="#4f5d75">Windows: its own lock code</text>
      </svg>
    </div>
  </div>
</body>
</html>
