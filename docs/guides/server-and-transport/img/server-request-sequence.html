<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One tools/call, from the client to the worker and back</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif','Noto Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:700px;width:100%}
.diagram-container{width:100%;overflow-x:auto}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;height:auto;display:block}
@media print{.diagram-container{overflow-x:visible}}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Sequence · Diagram Design</p>
<h1>One tool call: the transport queues it, the worker runs it, the transport answers</h1>
<div class="diagram-container">
<svg viewBox="0 0 800 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="srs-title srs-desc">
<title id="srs-title">One tools/call through the server, from the client to the worker and back</title>
<desc id="srs-desc">Five actors: the MCP client, the transport, the worker, the protocol and the registry. Eight numbered steps show one tools/call: the client sends it, the transport queues it in the worker with a limit of 64, the worker asks the protocol to answer it, the protocol checks the era, the _meta and the tool name, the worker checks the arguments and runs the tool from the registry, the registry returns a result or an error, the worker hands the reply to the transport with a limit of 40 000 characters, and the transport writes one stdout line or an HTTP 200. The worker is busy from step 3 to step 7, so the next call waits in the queue.</desc>
<defs>
<marker id="srs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="srs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>

<rect width="800" height="760" fill="#f5f5f5"/>

<!-- worker-busy band, step 3 to step 7 -->
<rect x="388" y="200" width="24" height="176" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/>

<!-- lifelines -->
<g stroke="#2d3142" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3,4">
<line x1="96" y1="84" x2="96" y2="424"/><line x1="248" y1="84" x2="248" y2="424"/><line x1="400" y1="84" x2="400" y2="424"/><line x1="552" y1="84" x2="552" y2="424"/><line x1="704" y1="84" x2="704" y2="424"/>
</g>

<!-- actor boxes -->
<g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">
<rect x="28" y="24" width="136" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<text x="96" y="50">MCP client</text>
<text x="96" y="70" font-family="Geist Mono, monospace" font-size="14" font-weight="400" fill="#4f5d75">the agent</text>
<rect x="180" y="24" width="136" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<text x="248" y="50">Transport</text>
<text x="248" y="70" font-family="Geist Mono, monospace" font-size="14" font-weight="400" fill="#4f5d75">stdio / HTTP</text>
<rect x="332" y="24" width="136" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<text x="400" y="50">Worker</text>
<text x="400" y="70" font-family="Geist Mono, monospace" font-size="14" font-weight="400" fill="#4f5d75">worker.py</text>
<rect x="484" y="24" width="136" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<text x="552" y="50">Protocol</text>
<text x="552" y="70" font-family="Geist Mono, monospace" font-size="14" font-weight="400" fill="#4f5d75">protocol.py</text>
<rect x="636" y="24" width="136" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<text x="704" y="50">Registry</text>
<text x="704" y="70" font-family="Geist Mono, monospace" font-size="14" font-weight="400" fill="#4f5d75">registry.py</text>
</g>

<!-- messages: arrows between lifelines -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="96" y1="124" x2="248" y2="124" marker-end="url(#srs-arrow)"/>
<line x1="248" y1="164" x2="400" y2="164" marker-end="url(#srs-arrow)"/>
<line x1="400" y1="204" x2="552" y2="204" marker-end="url(#srs-arrow)"/>
<line x1="552" y1="244" x2="400" y2="244" marker-end="url(#srs-arrow)"/>
<line x1="400" y1="284" x2="704" y2="284" marker-end="url(#srs-arrow)"/>
<line x1="704" y1="324" x2="400" y2="324" marker-end="url(#srs-arrow)"/>
<line x1="400" y1="364" x2="248" y2="364" marker-end="url(#srs-arrow)"/>
</g>
<line x1="248" y1="404" x2="96" y2="404" stroke="#bf4520" stroke-width="1.5" marker-end="url(#srs-arrow-accent)"/>

<!-- step labels: opaque mask 6px above each arrow -->
<rect x="108" y="100" width="112" height="18" rx="2" fill="#f5f5f5"/>
<rect x="260" y="140" width="152" height="18" rx="2" fill="#f5f5f5"/>
<rect x="416" y="180" width="152" height="18" rx="2" fill="#f5f5f5"/>
<rect x="416" y="220" width="160" height="18" rx="2" fill="#f5f5f5"/>
<rect x="416" y="260" width="152" height="18" rx="2" fill="#f5f5f5"/>
<rect x="416" y="300" width="136" height="18" rx="2" fill="#f5f5f5"/>
<rect x="260" y="340" width="72" height="18" rx="2" fill="#f5f5f5"/>
<rect x="108" y="380" width="176" height="18" rx="2" fill="#f5f5f5"/>
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#2d3142">
<text x="114" y="114">1 tools/call</text>
<text x="266" y="154">2 submit (max 64)</text>
<text x="422" y="194">3 answer(message)</text>
<text x="422" y="234">4 era, _meta, tool</text>
<text x="422" y="274">5 check args, run</text>
<text x="422" y="314">6 dict or error</text>
<text x="266" y="354">7 reply</text>
<text x="114" y="394" fill="#bf4520" font-weight="600">8 stdout or HTTP 200</text>
</g>

<!-- key -->
<line x1="24" y1="448" x2="776" y2="448" stroke="#2d3142" stroke-opacity="0.2"/>
<rect x="24" y="464" width="24" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/>
<text x="56" y="476" font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">worker busy from step 3 to step 7: the next call waits in the queue</text>

<!-- source of each step -->
<g font-family="Geist Mono, monospace" font-size="14" fill="#4f5d75">
<text x="24" y="512">1  stdio.py:38 · http_transport.py:143</text>
<text x="24" y="534">2  stdio.py:43 · http_transport.py:154</text>
<text x="24" y="556">3  worker.py:72 · protocol.py:191</text>
<text x="24" y="578">4  protocol.py:100-105, 168-171</text>
<text x="24" y="600">5  worker.py:155-158</text>
<text x="24" y="622">6  worker.py:159-168</text>
<text x="24" y="644">7  worker.py:72, 161-163 · 40 000 chars at most</text>
<text x="24" y="666">8  stdio.py:12 · http_transport.py:162</text>
</g>
<g font-family="Geist Mono, monospace" font-size="14" fill="#4f5d75">
<text x="24" y="696">ping and tools/list skip the queue (stdio.py:45)</text>
<text x="24" y="718">cancel on stdio: the reader sets the flag (worker.py:93)</text>
<text x="24" y="740">cancel on HTTP, modern era: the client closes (http_transport.py:155-159)</text>
</g>
</svg>
</div>
</div>
</body>
</html>
