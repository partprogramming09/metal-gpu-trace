<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The checks of a POST to /mcp, in order</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif','Noto Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:700px;width:100%}
.diagram-container{width:100%;overflow-x:auto}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;height:auto;display:block}
@media print{.diagram-container{overflow-x:visible}}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Flow · Diagram Design</p>
<h1>HTTP: six checks in order, and the status each one answers with</h1>
<div class="diagram-container">
<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="shc-title shc-desc">
<title id="shc-title">The checks the HTTP transport makes on a POST before anything runs</title>
<desc id="shc-desc">Seven boxes in a row, left to right: path, host and origin, token, size, JSON, headers and run. Under each of the first six is the status it answers with: 404, 403, 401, 413, 400 with a parse error, and 400 or 404 with a JSON-RPC error for a header that does not match. If all six pass, the request runs.</desc>
<defs>
<marker id="shc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="shc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>

<rect width="800" height="480" fill="#f5f5f5"/>

<text x="20" y="36" font-family="Geist Mono, monospace" font-size="14" fill="#4f5d75">THE FIRST CHECK THAT FAILS STOPS THE REQUEST · NOTHING HAS RUN</text>

<!-- arrows between the boxes -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="108" y1="124" x2="132" y2="124" marker-end="url(#shc-arrow)"/>
<line x1="220" y1="124" x2="244" y2="124" marker-end="url(#shc-arrow)"/>
<line x1="332" y1="124" x2="356" y2="124" marker-end="url(#shc-arrow)"/>
<line x1="444" y1="124" x2="468" y2="124" marker-end="url(#shc-arrow)"/>
<line x1="556" y1="124" x2="580" y2="124" marker-end="url(#shc-arrow)"/>
</g>
<line x1="668" y1="124" x2="692" y2="124" stroke="#bf4520" stroke-width="1.5" marker-end="url(#shc-arrow-accent)"/>

<!-- "pass" over each gap -->
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75" text-anchor="middle">
<text x="120" y="84">pass</text>
<text x="232" y="84">pass</text>
<text x="344" y="84">pass</text>
<text x="456" y="84">pass</text>
<text x="568" y="84">pass</text>
<text x="680" y="84">pass</text>
</g>

<!-- check boxes -->
<rect x="20" y="96" width="88" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="132" y="96" width="88" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="244" y="96" width="88" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="356" y="96" width="88" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="468" y="96" width="88" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="580" y="96" width="88" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="692" y="96" width="88" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>

<g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">
<text x="64" y="130">Path</text>
<text x="176" y="118">Host and</text>
<text x="176" y="136">Origin</text>
<text x="288" y="130">Token</text>
<text x="400" y="130">Size</text>
<text x="512" y="130">JSON</text>
<text x="624" y="130">Headers</text>
<text x="736" y="130">Run</text>
</g>

<!-- refusal arrows -->
<g stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" fill="none">
<line x1="64" y1="152" x2="64" y2="184" marker-end="url(#shc-arrow-accent)"/>
<line x1="176" y1="152" x2="176" y2="184" marker-end="url(#shc-arrow-accent)"/>
<line x1="288" y1="152" x2="288" y2="184" marker-end="url(#shc-arrow-accent)"/>
<line x1="400" y1="152" x2="400" y2="184" marker-end="url(#shc-arrow-accent)"/>
<line x1="512" y1="152" x2="512" y2="184" marker-end="url(#shc-arrow-accent)"/>
<line x1="624" y1="152" x2="624" y2="184" marker-end="url(#shc-arrow-accent)"/>
</g>

<!-- what the client gets when a check fails -->
<g stroke="#bf4520" stroke-opacity="0.6" fill="rgba(191,69,32,0.04)">
<rect x="12" y="184" width="104" height="136" rx="4"/>
<rect x="124" y="184" width="104" height="136" rx="4"/>
<rect x="236" y="184" width="104" height="136" rx="4"/>
<rect x="348" y="184" width="104" height="136" rx="4"/>
<rect x="460" y="184" width="104" height="136" rx="4"/>
<rect x="572" y="184" width="104" height="136" rx="4"/>
</g>
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle">
<text x="64" y="208" font-weight="600">404</text>
<text x="64" y="226">empty body</text>
<text x="64" y="244">nothing more</text>

<text x="176" y="208" font-weight="600">403</text>
<text x="176" y="226">empty body</text>
<text x="176" y="244">stops DNS</text>
<text x="176" y="262">rebinding</text>

<text x="288" y="208" font-weight="600">401</text>
<text x="288" y="226">empty body</text>
<text x="288" y="244">body unread</text>

<text x="400" y="208" font-weight="600">413</text>
<text x="400" y="226">empty body</text>
<text x="400" y="244">body unread</text>

<text x="512" y="208" font-weight="600">400</text>
<text x="512" y="226" font-family="Geist Mono, monospace">-32700</text>
<text x="512" y="244">parse error</text>

<text x="624" y="208" font-weight="600">400 or 404</text>
<text x="624" y="226">JSON-RPC</text>
<text x="624" y="244" font-family="Geist Mono, monospace">-32020</text>
<text x="624" y="262" font-family="Geist Mono, monospace">-32022</text>
<text x="624" y="280" font-family="Geist Mono, monospace">-32600</text>
<text x="624" y="298" font-family="Geist Mono, monospace">-32601</text>
</g>

<!-- key and notes -->
<line x1="24" y1="344" x2="776" y2="344" stroke="#2d3142" stroke-opacity="0.2"/>
<rect x="24" y="356" width="24" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
<text x="56" y="368" font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">the request goes on</text>
<line x1="260" y1="363" x2="300" y2="363" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#shc-arrow-accent)"/>
<text x="312" y="368" font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">a failed check: its reply is shown under it</text>

<text x="24" y="392" font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">GET and DELETE get 405 at once, before any check</text>
<text x="24" y="416" font-family="Geist Mono, monospace" font-size="14" fill="#4f5d75">-32020 header mismatch · -32022 unsupported version</text>
<text x="24" y="440" font-family="Geist Mono, monospace" font-size="14" fill="#4f5d75">-32600 old version · -32601 unknown method (404)</text>
<text x="24" y="464" font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">the token is checked before the body is read; a client that stalls is dropped after 15 s</text>
</svg>
</div>
</div>
</body>
</html>
