<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Windows recording engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif','Noto Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:700px;width:100%}
.diagram-container{width:100%;overflow-x:auto}
.eyebrow{font-family:var(--font-mono);font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:28px;font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:700px;max-width:100%;display:block}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Flow · Diagram Design</p>
<h1>The Windows engine: one run, eight steps</h1>
<div class="diagram-container">
<svg viewBox="0 0 800 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="windows-engine-title windows-engine-desc">
<title id="windows-engine-title">One Windows recording</title>
<desc id="windows-engine-desc">Eight boxes in two rows. Top row: take the lock, start the program, choose the frame source (PresentMon if installed, otherwise a DWM thread), then the one-second loop. Bottom row: stop and clean up, choose the frames from the first source that has any (drawstress log, PresentMon, DWM samples, or an error), write the frames and summary, and recording.finish.</desc>
<defs>
<marker id="wn-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
</defs>
<rect width="800" height="464" fill="#f5f5f5"/>
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">
<text x="20" y="32">No Instruments, no .trace: the frames come from the first source that has any.</text>
<text x="20" y="56">A failure at any step deletes the run's files and frees the lock.</text>
</g>

<!-- arrows first, so the boxes sit on top -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="180" y1="152" x2="220" y2="152" marker-end="url(#wn-arrow)"/>
<line x1="380" y1="152" x2="420" y2="152" marker-end="url(#wn-arrow)"/>
<line x1="580" y1="152" x2="620" y2="152" marker-end="url(#wn-arrow)"/>
<path d="M700 216 V232 A8 8 0 0 1 692 240 H108 A8 8 0 0 1 100 248 V264" marker-end="url(#wn-arrow)"/>
<line x1="180" y1="328" x2="220" y2="328" marker-end="url(#wn-arrow)"/>
<line x1="380" y1="328" x2="420" y2="328" marker-end="url(#wn-arrow)"/>
<line x1="580" y1="328" x2="620" y2="328" marker-end="url(#wn-arrow)"/>
</g>

<!-- row 1 -->
<rect x="20" y="88" width="160" height="128" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="220" y="88" width="160" height="128" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="420" y="88" width="160" height="128" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-dasharray="5,4"/>
<rect x="620" y="88" width="160" height="128" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<!-- row 2 -->
<rect x="20" y="264" width="160" height="128" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="220" y="264" width="160" height="128" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="420" y="264" width="160" height="128" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="620" y="264" width="160" height="128" rx="6" fill="#f5f5f5" stroke="#2d3142"/>

<g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">
<text x="100" y="116">Lock</text>
<text x="300" y="116">Program</text>
<text x="500" y="116">Frame source?</text>
<text x="700" y="116">1 s loop</text>
<text x="100" y="292">Stop and clean up</text>
<text x="300" y="292">Which frames?</text>
<text x="500" y="292">Write</text>
<text x="700" y="292">recording.finish</text>
</g>
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75" text-anchor="middle">
<text x="100" y="140">make lock folder</text><text x="100" y="158">write our pid</text><text x="100" y="176">dead owner: retake</text><text x="100" y="194">else: refuse</text>
<text x="300" y="140">start with Popen</text><text x="300" y="158">DRAWSTRESS_LOG set</text><text x="300" y="176">attach: find pid</text>
<text x="500" y="140">PresentMon found?</text><text x="500" y="158">yes: run it</text><text x="500" y="176">no: 1 ms DWM thread</text>
<text x="700" y="140">sample RSS each s</text><text x="700" y="158">stop on cancel,</text><text x="700" y="176">deadline or exit</text>
<text x="100" y="316">kill program tree</text><text x="100" y="334">stop PresentMon</text><text x="100" y="352">on cancel: delete</text><text x="100" y="370">run files</text>
<text x="300" y="316">drawstress-log,</text><text x="300" y="334">presentmon,</text><text x="300" y="352">dwm-composition,</text><text x="300" y="370">none: error</text>
<text x="500" y="316">frames.csv.gz</text><text x="500" y="334">summary .json</text><text x="500" y="352">KEEP_RUNS cleanup</text>
<text x="700" y="316">add layer, context</text><text x="700" y="334">tier, disk limit</text>
</g>

<line x1="20" y1="424" x2="780" y2="424" stroke="#2d3142" stroke-opacity="0.2"/>
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">
<rect x="20" y="440" width="24" height="12" rx="3" fill="none" stroke="#2d3142" stroke-dasharray="5,4"/>
<text x="52" y="451">decision</text>
<rect x="160" y="440" width="24" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-dasharray="5,4"/>
<text x="192" y="451">the choice that sets the numbers</text>
<text x="480" y="451">step 8 is shared with macOS</text>
</g>
</svg>
</div>
</div>
</body>
</html>
