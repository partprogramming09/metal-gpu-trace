<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preflight checks before a recording starts</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif','Noto Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:700px;width:100%}
.diagram-container{width:100%;overflow-x:auto}
.eyebrow{font-family:var(--font-mono);font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:28px;font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:700px;max-width:100%;display:block}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Flow · Diagram Design</p>
<h1>Preflight: six checks, in order, before anything starts</h1>
<div class="diagram-container">
<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="preflight-checks-title preflight-checks-desc">
<title id="preflight-checks-title">Checks before a recording starts</title>
<desc id="preflight-checks-desc">Seven boxes in a row: arguments, program, xcrun, disk, screen, lock and start. Each of the first six can refuse the recording, and the message it gives is written under it; when all six pass, the recording starts.</desc>
<defs>
<marker id="pf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="pf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="800" height="320" fill="#f5f5f5"/>
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">
<text x="24" y="32">The first check that fails stops the recording. No process has started yet.</text>
<text x="24" y="56">The screen is checked only here; perf_record.sh repeats checks 1, 2, 4 and 6.</text>
</g>

<!-- arrows first, so the boxes sit on top -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
<line x1="104" y1="120" x2="136" y2="120" marker-end="url(#pf-arrow)"/>
<line x1="216" y1="120" x2="248" y2="120" marker-end="url(#pf-arrow)"/>
<line x1="328" y1="120" x2="360" y2="120" marker-end="url(#pf-arrow)"/>
<line x1="440" y1="120" x2="472" y2="120" marker-end="url(#pf-arrow)"/>
<line x1="552" y1="120" x2="584" y2="120" marker-end="url(#pf-arrow)"/>
</g>
<line x1="664" y1="120" x2="696" y2="120" stroke="#bf4520" stroke-width="1.2" marker-end="url(#pf-arrow-accent)"/>

<!-- pass labels: opaque mask, 6 px gap above the arrow, inside the gap -->
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75" text-anchor="middle">
<rect x="105" y="98" width="30" height="16" rx="2" fill="#f5f5f5"/><text x="120" y="111">pass</text>
<rect x="217" y="98" width="30" height="16" rx="2" fill="#f5f5f5"/><text x="232" y="111">pass</text>
<rect x="329" y="98" width="30" height="16" rx="2" fill="#f5f5f5"/><text x="344" y="111">pass</text>
<rect x="441" y="98" width="30" height="16" rx="2" fill="#f5f5f5"/><text x="456" y="111">pass</text>
<rect x="553" y="98" width="30" height="16" rx="2" fill="#f5f5f5"/><text x="568" y="111">pass</text>
<rect x="665" y="98" width="30" height="16" rx="2" fill="#f5f5f5"/><text x="680" y="111">pass</text>
</g>

<!-- check boxes -->
<rect x="24" y="88" width="80" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="136" y="88" width="80" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="248" y="88" width="80" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="360" y="88" width="80" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="472" y="88" width="80" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="584" y="88" width="80" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
<rect x="696" y="88" width="80" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
<g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">
<text x="64" y="125">Arguments</text>
<text x="176" y="125">Program</text>
<text x="288" y="125">xcrun</text>
<text x="400" y="125">Disk</text>
<text x="512" y="125">Screen</text>
<text x="624" y="125">Lock</text>
<text x="736" y="112">Start</text>
<text x="736" y="130">recording</text>
</g>

<!-- refusals: dashed, one per check, each with its message -->
<g stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" fill="none">
<line x1="64" y1="152" x2="64" y2="174" marker-end="url(#pf-arrow)"/>
<line x1="176" y1="152" x2="176" y2="174" marker-end="url(#pf-arrow)"/>
<line x1="288" y1="152" x2="288" y2="174" marker-end="url(#pf-arrow)"/>
<line x1="400" y1="152" x2="400" y2="174" marker-end="url(#pf-arrow)"/>
<line x1="512" y1="152" x2="512" y2="174" marker-end="url(#pf-arrow)"/>
<line x1="624" y1="152" x2="624" y2="174" marker-end="url(#pf-arrow)"/>
</g>
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle">
<text x="64" y="196">seconds must</text><text x="64" y="214">be 1 to 3600</text>
<text x="176" y="196">no Wine at</text><text x="176" y="214">bin/wine, or</text><text x="176" y="232">not executable</text>
<text x="288" y="196">not on PATH:</text><text x="288" y="214">install Xcode</text>
<text x="400" y="196">not enough</text><text x="400" y="214">free disk:</text><text x="400" y="232">N GB free,</text><text x="400" y="250">M GB needed</text>
<text x="512" y="196">screen locked</text><text x="512" y="214">unlock to run</text>
<text x="624" y="196">another run</text><text x="624" y="214">is running;</text><text x="624" y="232">remove lock</text><text x="624" y="250">if none is</text>
</g>

<line x1="24" y1="276" x2="776" y2="276" stroke="#2d3142" stroke-opacity="0.2"/>
<g font-family="Geist, system-ui, sans-serif" font-size="14" fill="#4f5d75">
<line x1="24" y1="300" x2="56" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pf-arrow)"/>
<text x="66" y="305">the check passed</text>
<line x1="260" y1="300" x2="292" y2="300" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pf-arrow)"/>
<text x="302" y="305">refused, with the message written under the check</text>
</g>
</svg>
</div>
</div>
</body>
</html>
