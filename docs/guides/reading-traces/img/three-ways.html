<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three ways to read a recording, and where each one stops</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 800px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    /* The diagram is drawn at 800 units and shown at 700 px. */
    svg { width: 700px; max-width: 100%; height: auto; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Diagram Design</p>
    <h1>Three ways to read a recording, and where each one stops</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 800 796" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="three-ways-title three-ways-desc">
        <title id="three-ways-title">Three ways to read a recording, and where each one stops</title>
        <desc id="three-ways-desc">Three rows of three boxes, each a flow from left to right: reading a .trace with xctrace, reading a .gputrace without Xcode, and exporting a run's frames table to a Chrome trace file, with an accent box in each row marking where that way stops.</desc>
        <defs>
          <marker id="tw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- arrows, drawn first -->
        <g stroke="#4f5d75" stroke-width="1" fill="none">
          <line x1="260" y1="138" x2="284" y2="138" marker-end="url(#tw-arrow)"/>
          <line x1="516" y1="138" x2="540" y2="138" marker-end="url(#tw-arrow)"/>
          <line x1="260" y1="368" x2="284" y2="368" marker-end="url(#tw-arrow)"/>
          <line x1="516" y1="368" x2="540" y2="368" marker-end="url(#tw-arrow)"/>
          <line x1="260" y1="598" x2="284" y2="598" marker-end="url(#tw-arrow)"/>
          <line x1="516" y1="598" x2="540" y2="598" marker-end="url(#tw-arrow)"/>
        </g>

        <!-- lane labels -->
        <g font-family="Geist Mono, monospace" font-size="14" fill="#4f5d75">
          <text x="28" y="34">.trace · read with xctrace</text>
          <text x="28" y="264">.gputrace · no Xcode needed</text>
          <text x="28" y="494">frames table · no .trace needed</text>
        </g>

        <!-- boxes: paper fill masks the arrows; accent border marks where the row stops -->
        <g fill="#f5f5f5" stroke="#2d3142" stroke-width="1">
          <rect x="28" y="44" width="232" height="188" rx="6"/>
          <rect x="284" y="44" width="232" height="188" rx="6" stroke="#bf4520" stroke-width="1.5"/>
          <rect x="540" y="44" width="232" height="188" rx="6"/>
          <rect x="28" y="274" width="232" height="188" rx="6" stroke="#bf4520" stroke-width="1.5"/>
          <rect x="284" y="274" width="232" height="188" rx="6"/>
          <rect x="540" y="274" width="232" height="188" rx="6"/>
          <rect x="28" y="504" width="232" height="188" rx="6" stroke="#bf4520" stroke-width="1.5"/>
          <rect x="284" y="504" width="232" height="188" rx="6"/>
          <rect x="540" y="504" width="232" height="188" rx="6"/>
        </g>

        <!-- row 1: .trace -->
        <g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">
          <text x="44" y="72">1 · Find the trace</text>
          <text x="300" y="72">2 · Export one table</text>
          <text x="556" y="72">3 · Filter, then rows</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="14" fill="#4f5d75">
          <text x="44" y="96">a run name, or a path</text>
          <text x="44" y="116">in METAL_TRACE_READ</text>
          <text x="300" y="96">one xctrace export,</text>
          <text x="300" y="116">to a temp XML</text>
          <text x="556" y="96">pid keeps one process</text>
          <text x="556" y="116">a page of 500 rows</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="14" fill="#bf4520">
          <text x="300" y="144">no .trace folder:</text>
          <text x="300" y="164">FileNotFoundError</text>
          <text x="300" y="184">xctrace fails:</text>
          <text x="300" y="204">RuntimeError</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="14" fill="#5a6580">
          <text x="44" y="222">traces.py:98-101</text>
          <text x="300" y="222">perf_report.py:49-66</text>
          <text x="556" y="222">traces.py:92-114</text>
        </g>

        <!-- row 2: .gputrace -->
        <g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">
          <text x="44" y="302">1 · Resolve the bundle</text>
          <text x="300" y="302">2 · Split into records</text>
          <text x="556" y="302">3 · Count, diff, list</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="14" fill="#4f5d75">
          <text x="44" y="326">in METAL_TRACE_OUT or</text>
          <text x="44" y="346">METAL_TRACE_READ</text>
          <text x="300" y="326">reads the whole file</text>
          <text x="300" y="346">[size][id] per record</text>
          <text x="556" y="326">summary: top 100 calls</text>
          <text x="556" y="346">diff, records: 1 page</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="14" fill="#bf4520">
          <text x="300" y="374">size under 8 or past</text>
          <text x="300" y="394">the end: ValueError</text>
          <text x="300" y="414">nothing is guessed</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="14" fill="#5a6580">
          <text x="44" y="452">paths.py:17-22</text>
          <text x="300" y="452">gputrace_read.py:48-60</text>
          <text x="556" y="452">gputrace_read.py:72-141</text>
        </g>

        <!-- row 3: frames table -->
        <g font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">
          <text x="44" y="532">1 · Find the frames</text>
          <text x="300" y="532">2 · One slice a frame</text>
          <text x="556" y="532">3 · Write the file</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="14" fill="#4f5d75">
          <text x="44" y="556">&lt;run&gt;.frames.csv.gz</text>
          <text x="44" y="576">or .csv in OUT</text>
          <text x="300" y="556">ts, dur: microseconds</text>
          <text x="300" y="576">gpu times as args</text>
          <text x="556" y="556">&lt;run&gt;.chrome-trace in</text>
          <text x="556" y="576">the runs folder</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="14" fill="#bf4520">
          <text x="44" y="604">none: ToolError,</text>
          <text x="44" y="624">record it again</text>
        </g>
        <g font-family="Geist Mono, monospace" font-size="14" fill="#5a6580">
          <text x="44" y="682">traces.py:14-17</text>
          <text x="300" y="682">traces.py:18-27</text>
          <text x="556" y="682">traces.py:28-30</text>
        </g>

        <!-- footer -->
        <line x1="28" y1="724" x2="772" y2="724" stroke="#2d3142" stroke-opacity="0.2" stroke-width="1"/>
        <g font-family="Geist Mono, monospace" font-size="14" fill="#4f5d75">
          <text x="28" y="748">every failure comes back as error text: worker.py:165-168</text>
          <text x="28" y="772">accent box: where that way stops</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
