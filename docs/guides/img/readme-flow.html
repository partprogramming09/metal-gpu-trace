<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>metal-gpu-trace flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 800px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    /* The diagram is 800 units wide; on the page it is shown at 700px. */
    svg { width: 100%; max-width: 700px; min-width: 0; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · metal-gpu-trace</p>
    <h1>metal-gpu-trace flow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 800 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="readme-flow-title readme-flow-desc">
        <title id="readme-flow-title">metal-gpu-trace flow</title>
        <desc id="readme-flow-desc">An AI agent calls the metal-gpu-trace MCP server, which has Instruments record the program and write summary JSON and CSV tables; the agent then reads those summaries to compare runs or a baseline.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first, then nodes -->
        <line x1="330" y1="120" x2="330" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="330" y1="248" x2="330" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="330" y1="376" x2="330" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M480 464 H512 Q520 464 520 456 V88 Q520 80 512 80 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="530" y="268" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif">reads and compares with</text>
        <text x="530" y="288" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif">other runs or a baseline</text>

        <!-- 1. AI agent -->
        <rect x="180" y="40" width="300" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="180" y="40" width="300" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#8d99ae" stroke-width="1"/>
        <text x="330" y="85" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">AI agent</text>

        <!-- 2. metal-gpu-trace MCP server (focal) -->
        <rect x="180" y="168" width="300" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="180" y="168" width="300" height="80" rx="6" fill="#f6e3da" stroke="#bf4520" stroke-width="1"/>
        <text x="330" y="213" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">metal-gpu-trace MCP server</text>

        <!-- 3. Instruments -->
        <rect x="180" y="296" width="300" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="180" y="296" width="300" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="330" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Instruments records the program</text>
        <text x="330" y="352" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">(Metal System Trace)</text>

        <!-- 4. Summary files -->
        <rect x="180" y="424" width="300" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="180" y="424" width="300" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="330" y="458" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Summary JSON + per-frame</text>
        <text x="330" y="480" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">and memory CSV tables</text>
      </svg>
    </div>
  </div>
</body>
</html>
