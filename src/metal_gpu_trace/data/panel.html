<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Metal trace panel</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --card: #ffffff; --line: #e3e2dd; --grid: #ecebe6;
  --ink: #0b0b0b; --ink2: #52514e; --ink3: #5f5e5a;
  --s1: #2a78d6; --s2: #eb6834;
  --good: #1a4f91; --good-bg: #dbe6f3; --bad: #9a3d12; --bad-bg: #fbe3d3;
  --band: #cfe0f5; --limit-good: #1f63b8; --limit-bad: #b84a1c; --tag-bg: #fbeee6; --tag-ink: #8a3a12;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: #1a1a19; --card: #222221; --line: #383835; --grid: #2d2d2b;
    --ink: #f0efec; --ink2: #c3c2b7; --ink3: #94938b;
    --s1: #3987e5; --s2: #d95926;
    --good: #8fbaf0; --good-bg: #1f3350; --bad: #f0a27c; --bad-bg: #4a2a1a;
    --band: #26405f; --limit-good: #6fa8ee; --limit-bad: #e8895a; --tag-bg: #3d2a1f; --tag-ink: #f0b497;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19; --card: #222221; --line: #383835; --grid: #2d2d2b;
  --ink: #f0efec; --ink2: #c3c2b7; --ink3: #94938b;
  --s1: #3987e5; --s2: #d95926;
  --good: #8fbaf0; --good-bg: #1f3350; --bad: #f0a27c; --bad-bg: #4a2a1a;
  --band: #26405f; --limit-good: #6fa8ee; --limit-bad: #e8895a; --tag-bg: #3d2a1f; --tag-ink: #f0b497;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
h1 { font-size: 18px; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 0 0 8px; }
h3 { font-size: 17px; line-height: 1.3; margin: 0 0 6px; }
.sub { color: var(--ink2); margin: 0 0 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.bar .grow { flex: 1; }
button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }
button[aria-pressed="false"] { color: var(--ink3); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; position: relative; }
.card.dashed { background: transparent; border-style: dashed; }
.stack { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
.stack > .card { margin: 0; }
.lbl { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink3); font-weight: 600; margin: 0 0 6px; }
.projbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.projbar .lbl { margin: 0; }
.pill { padding: 3px 10px; border-radius: 999px; background: var(--grid); color: var(--ink2); font-size: 13px; }
.pill.ok { background: var(--good-bg); color: var(--good); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.tag { padding: 5px 12px; border-radius: 999px; background: var(--tag-bg); color: var(--tag-ink); font-size: 13px; }
.goto { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.goto .lbl { margin: 0 4px 0 0; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--ink2); margin-bottom: 4px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink2); font-weight: 600; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--ink3); font-size: 11px; }
.axis { stroke: var(--grid); }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; display: none; white-space: pre; }
.hb { display: grid; grid-template-columns: 110px 1fr 70px; gap: 8px; align-items: center; margin: 2px 0; }
.hb i { display: block; height: 8px; border-radius: 0 4px 4px 0; }
.note { color: var(--ink2); margin: 6px 0 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.cards .card { margin: 0; }
.cards .card.main { border-color: var(--ink); }
.big { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.label { color: var(--ink2); }
small { display: block; color: var(--ink2); font-size: 11px; font-weight: 400; }
ul { margin: 4px 0; padding-left: 20px; }
.verdicts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.verdict { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.ring { width: 130px; height: 130px; border-radius: 50%; border: 10px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; flex: none; }
.ring.improved { border-color: var(--s1); }
.ring.regressed { border-color: var(--s2); }
.ring b { font-size: 19px; }
.vbody { flex: 1 1 200px; min-width: 0; }
.rrow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 200px; gap: 12px; align-items: center; margin: 6px 0; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 26px; background: var(--grid); border-radius: 6px; }
.band { position: absolute; top: 6px; height: 14px; min-width: 4px; background: var(--band); border-radius: 3px; }
.lim { position: absolute; top: 2px; height: 22px; width: 0; border-left: 2px dashed; }
.lim.bad { border-color: var(--limit-bad); }
.lim.good { border-color: var(--limit-good); }
.dot { position: absolute; top: 6px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--ink); border: 2px solid var(--card); box-sizing: border-box; }
.dot.a { background: var(--s1); }
.dot.b { background: var(--s2); }
.dline { position: absolute; top: 12px; height: 3px; background: var(--ink3); }
.dtag { position: absolute; top: -13px; font-size: 11px; color: var(--ink2); transform: translateX(-50%); }
.key { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink2); margin: 4px 0 0; }
.key i { display: inline-block; width: 18px; height: 8px; margin-right: 6px; border-radius: 2px; vertical-align: middle; }
.key i.l { width: 0; height: 12px; border-left: 2px dashed; border-radius: 0; }
.scroll { overflow-x: auto; }
.heat { min-width: 560px; }
.heat th, .heat td { text-align: center; padding: 6px 8px; }
.heat th[scope="row"] { text-align: left; }
.heat th.hhead { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heat td { border: 2px solid var(--card); border-radius: 6px; background: var(--grid); }
.heat td.better { background: var(--good-bg); color: var(--good); }
.heat td.worse { background: var(--bad-bg); color: var(--bad); }
.heat td small { color: inherit; }
.sband { fill: var(--band); }
.sbad { stroke: var(--limit-bad); stroke-dasharray: 6 4; }
.sgood { stroke: var(--limit-good); stroke-dasharray: 6 4; }
.sline { stroke: var(--ink3); fill: none; stroke-width: 2; }
.pt { fill: var(--ink); stroke: var(--card); stroke-width: 1.5; }
.pt.better { fill: var(--limit-good); }
.pt.worse { fill: var(--limit-bad); }
.pt.sel { stroke: var(--ink); stroke-width: 2.5; }
.tnames { display: grid; gap: 0; font-size: 11px; color: var(--ink2); text-align: center; }
.tnames span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.drow { margin: 14px 0; }
.drow > div:first-child { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.tray { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.tray > div { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; }
details.help { display: inline-block; position: relative; margin-left: 6px; vertical-align: baseline; }
details.help > summary { list-style: none; cursor: pointer; width: 16px; height: 16px; border: 1px solid var(--ink3); border-radius: 50%; color: var(--ink2); font-size: 11px; line-height: 14px; text-align: center; }
details.help > summary::-webkit-details-marker { display: none; }
details.help > div { position: absolute; z-index: 5; left: 0; top: 22px; width: 280px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--ink); font-size: 12px; font-weight: 400; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
th details.help > div, td:last-child details.help > div { left: auto; right: 0; }
textarea { width: 100%; height: 90px; font: 12px ui-monospace, monospace; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
@media (max-width: 600px) {
  .hb { grid-template-columns: 80px 1fr 56px; }
  .rrow { grid-template-columns: 1fr; gap: 4px; }
  .verdict { justify-content: center; }
  .verdicts { grid-template-columns: 1fr; }
  .cards { grid-template-columns: 1fr; }
  details.help > div { width: 220px; }
}
</style>
</head>
<body>
<main>
  <div class="bar"><h1 class="grow" id="title"></h1><button type="button" id="lang" aria-label="Language"></button><button type="button" id="edit" aria-pressed="false"></button></div>
  <p class="sub" id="runs"></p>
  <div class="projbar" id="project"></div>
  <div id="layout" class="card" hidden>
    <textarea id="layout-json" aria-label="Layout JSON"></textarea>
    <div class="bar"><button type="button" id="layout-apply"></button><button type="button" id="layout-reset"></button></div>
  </div>
  <div class="tags" id="tags"></div>
  <nav class="goto" id="goto" aria-label="Ir a / Go to"></nav>
  <div id="sections"></div>
  <section class="card" id="missing" hidden></section>
</main>
<script>
"use strict";

const IDS = ["tests", "summary", "ab", "frames", "encoders", "counters", "memory", "data"];
const PRESETS = {
  fps: ["tests", "summary", "frames", "encoders", "counters", "memory", "data"],
  compare: ["tests", "summary", "ab", "frames", "encoders", "counters", "memory", "data"],
};
const NS = "http://www.w3.org/2000/svg";

  gpu_ms_p95: true, frame_interval_ms_p95: true, metal_mib_peak: true, rss_mib_max: true, encoders_per_frame_p50: true, command_buffers_per_frame_p50: true};

const CARD_KEYS = ["fps", "fps_1pct_low", "hitches", "metal_mib_peak"];
const MARK = {better: "▲", worse: "▼", same: "="};
const VMARK = {improved: "▲", regressed: "▼", same: "=", none: "?"};

const T = {
  es: {
    ui: {title: "Panel de traza Metal", vs: " contra ", summary: "Resumen", frames: "Frames", memory: "Memoria y térmico", ab: "A y B", encoders: "Encoders", counters: "Contadores GPU",
      data: "Datos", edit: "Personalizar", apply: "Aplicar", reset: "Restablecer", gpuFrame: "Tiempo de GPU por frame",

      needTwo: "Comparar necesita dos grabaciones.", to: "a", at: "en", hitch: "hitch", change: "cambio", changePct: "cambio %",
      better: "mejor", worse: "peor", same: "igual", unknown: "sin dato", verdict: "Veredicto", cards: "Lo principal",

/** Returns the strings of the current language. */
function L() { return T[lang]; }

/** Builds an element with attributes and children; every string goes in as text. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  for (const kid of kids) el.append(kid);
  return el;
}

/** Builds an SVG element with attributes. */
function s(tag, attrs, text) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

/** Formats a number for a table cell; a missing value shows as a dash. */
function fmt(v, digits) {
  return v === null || v === undefined ? "–" : (typeof v === "number" ? +v.toFixed(digits === undefined ? 2 : digits) : String(v));
}

/** Returns a "?" button that opens a short explanation. */

}

/** Returns a metric's label followed by its help. */
function metricName(id) {
  const [label, text] = L().m[id];
  return h("span", {}, label, help(text));
}

/** Returns a swatch followed by a run's name, with its layer unless `short` (the header and legend already show it). */
function runName(i, short) {
  const r = DATA.runs[i], sw = h("span", {class: "sw"});
  sw.style.background = COLORS[i];
  return h("span", {}, sw, r.name + (r.layer && !short ? " (" + r.layer + ")" : "") + (r.source === "windows" ? " · Windows" : ""));
}

/** Returns the legend row for the runs. */
function legend() {
  const box = h("div", {class: "legend"});
  DATA.runs.forEach((r, i) => box.append(runName(i)));
  return box;
}

/** Returns a table from a header row and body rows; a cell is text or a node. */
function table(head, rows) {
  const t = h("table"), tr = h("tr");
  head.forEach(c => { const th = h("th"); th.append(c); tr.append(th); });
  t.append(h("thead", {}, tr));
  const body = h("tbody");
  rows.forEach(r => { const row = h("tr"); r.forEach(c => { const td = h("td"); td.append(c instanceof Node ? c : String(c)); row.append(td); }); body.append(row); });
  t.append(body);
  return t;
}

/** Returns a line chart for series of {name, points: [[x, y]], marks}, with a hover readout. */
function lineChart(series, unit) {
  const W = 800, H = 220, Lm = 44, R = 10, T0 = 10, B = 24;
  const xs = series.flatMap(p => p.points.map(q => q[0]));
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const top = Math.max(...series.flatMap(p => p.points.map(q => q[1]))) || 1;
  const X = x => Lm + (xMax === xMin ? 0 : (x - xMin) / (xMax - xMin)) * (W - Lm - R);
  const Y = y => H - B - (Math.min(y, top) / top) * (H - T0 - B);
  const svg = s("svg", {viewBox: `0 0 ${W} ${H}`, role: "img"});
  for (let i = 0; i <= 4; i++) {
    const y = T0 + i * (H - T0 - B) / 4;
    svg.append(s("line", {x1: Lm, x2: W - R, y1: y, y2: y, class: "axis"}));
    svg.append(s("text", {x: Lm - 6, y: y + 4, "text-anchor": "end"}, fmt(top * (1 - i / 4), 1) + (i === 0 ? " " + unit : "")));
  }
  svg.append(s("text", {x: Lm, y: H - 6}, fmt(xMin / 1000, 1) + " s"));
  svg.append(s("text", {x: W - R, y: H - 6, "text-anchor": "end"}, fmt(xMax / 1000, 1) + " s"));
  series.forEach((p, i) => {
    svg.append(s("polyline", {points: p.points.map(q => X(q[0]).toFixed(1) + "," + Y(q[1]).toFixed(1)).join(" "),
      fill: "none", stroke: COLORS[i], "stroke-width": 2, "stroke-linejoin": "round"}));
    (p.marks || []).forEach(m => {
      const x = X(m[0]), y = Y(m[1]);
      svg.append(s("path", {d: `M${x - 4},${y - 8} L${x + 4},${y - 8} L${x},${y - 1} Z`, fill: "var(--ink)", stroke: "var(--card)", "stroke-width": 1.5}));
    });
  });
  const cross = s("line", {y1: T0, y2: H - B, stroke: "var(--ink3)", visibility: "hidden"});
  svg.append(cross);
  const tip = h("div", {class: "tip"});
  svg.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const x = xMin + ((ev.clientX - box.left) / box.width * W - Lm) / (W - Lm - R) * (xMax - xMin);
    tip.textContent = series.map(p => {
      let best = p.points[0];
      for (const q of p.points) if (Math.abs(q[0] - x) < Math.abs(best[0] - x)) best = q;
      const mark = (p.marks || []).find(m => Math.abs(m[0] - best[0]) < 1e-6);
      return p.name + ": " + fmt(best[1], 2) + " " + unit + " " + L().ui.at + " " + fmt(best[0] / 1000, 2) + " s" +
        (mark ? " · " + L().ui.hitch + " " + fmt(mark[2], 1) + " ms" + (mark[3] ? " (" + mark[3] + ")" : "") + (mark[4] != null ? " · CPU " + fmt(mark[4], 0) + " %" : "") : "");
    }).join("\n");
    tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX - box.left + 12, box.width - 200) + "px";
    tip.style.top = (ev.clientY - box.top + 12) + "px";
    const cx = X(x);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
  });
  svg.addEventListener("mouseleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });
  return h("div", {style: "position:relative"}, svg, tip);
}

/** Returns a run's value for a metric id, or null when the summary lacks it. */
function metric(r, id) {

      gpu_ms_p50: () => g.frame_gpu_ms.p50, gpu_ms_mean: () => g.frame_gpu_ms.mean, gpu_ms_p95: () => g.frame_gpu_ms.p95,
      gpu_ms_max: () => g.frame_gpu_ms.max, frame_interval_ms_p95: () => g.frame_interval_ms.p95, frame_jitter_ms: () => g.frame_jitter_ms,

  } catch (e) { return null; }

/** Returns "better", "worse", "same" or null for a comparison entry of a metric where lower or higher is better. */
function direction(id, c) {
  if (!c || c.change === null || c.change === undefined || !(id in LOWER) || DATA.not_comparable.includes(id)) return null;
  if (c.change === 0 || (c.change_pct !== null && Math.abs(c.change_pct) < DATA.rules.noise_pct)) return "same";
  return (c.change < 0) === LOWER[id] ? "better" : "worse";
}

/** Returns a signed percentage for a cell, or a dash when there is none. */
function pctText(p) {
  return p === null || p === undefined ? "–" : (p > 0 ? "+" : p < 0 ? "−" : "") + fmt(Math.abs(p), 1) + " %";
}

/** Returns a metric's short name in the current language. */
function metricLabel(id) {
  return (L().m[id] || [id])[0];
}

/** Returns the text of a run's section reason, or the id itself when a newer server sent one this page does not know. */
function reasonText(id) {
  return L().r[id] || id;
}

/** Returns the limits perf_check draws around a reference range {min, max}: [worse, better]. Counts have no margin. */
function limits(metric, span) {
  const margin = metric.endsWith("_p50") ? 0 : DATA.rules.noise_pct / 100;
  return LOWER[metric] ? [span.max * (1 + margin), span.min * (1 - margin)] : [span.min * (1 - margin), span.max * (1 + margin)];
}

/** Returns a function that maps a value to a percentage of the track, for the values given plus some room. */
function scale(values) {
  const lo0 = Math.min(...values), hi0 = Math.max(...values);
  const pad = (hi0 - lo0) * 0.12 || Math.abs(hi0) * 0.05 || 1;
  const lo = lo0 - pad, hi = hi0 + pad;
  return x => (100 * (x - lo) / (hi - lo)).toFixed(2) + "%";
}

/** Returns one row of the range view: the reference's band, the build's value as a dot and the limits past which

  const d = (check.regressed || []).some(r => r.metric === metric) ? "worse" : (check.improved || []).some(r => r.metric === metric) ? "better" :
    (check.unchecked || []).includes(metric) ? null : "same";
  const track = h("div", {class: "track"}), band = h("div", {class: "band"}), dot = h("div", {class: "dot"});
  band.style.left = at(span.min); band.style.width = `calc(${at(span.max)} - ${at(span.min)})`;
  dot.style.left = at(value);
  const lim = (cls, x) => { const el = h("div", {class: "lim " + cls}); el.style.left = at(x); return el; };
  track.append(band, lim("bad", bad), lim("good", good), dot);
  const text = `${metricLabel(metric)} ${fmt(value)}; ${u.refShort} ${fmt(span.min)}–${fmt(span.max)}` + (d ? "; " + u[d] : "");

    h("div", {}, h("strong", {}, metricLabel(metric)), h("small", {}, u[LOWER[metric] ? "lower" : "higher"])), track,
    h("div", {}, h("strong", {}, fmt(value)), " · " + u.refShort + " " + fmt(span.min) + "–" + fmt(span.max) + (d ? " " + MARK[d] + " " + u[d] : "")));
}

/** Returns the table of builds against the reference: each cell is the change in % against the reference's mean with its

function heatmap(changes) {

/** Returns true when `list` is a list of {id, on} with ids the page draws. */
function validLayout(list) {
  return Array.isArray(list) && list.every(w => w && IDS.includes(w.id) && typeof w.on === "boolean");
}

/** Returns `list` with `tests`, the page's lead, added first and on when it does not name it: a layout saved or written
 * before that section existed keeps its order and gains it. Any other section it leaves out stays hidden. */
function complete(list) {
  return list.some(w => w.id === "tests") ? list : [{id: "tests", on: true}, ...list];
}

/** Returns the saved layout (section ids with on/off), or the preset's when nothing valid is saved. */
function loadLayout() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (validLayout(saved)) return complete(saved);
  } catch (e) { /* storage blocked or empty */ }
  return defaultLayout();
}

/** Returns the layout the file panel.json gave, or the preset's sections all on. */
function defaultLayout() {
  return complete(DATA.layout || PRESETS[DATA.preset].map(id => ({id, on: true})));
}

/** Saves the layout where the browser allows it and draws the panel again. */
function setLayout(next) {
  layout = next;
  try { localStorage.setItem(KEY, JSON.stringify(layout)); } catch (e) { /* storage blocked */ }
  draw();
}

function goTo(id) {
  const el = document.getElementById(id), calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (el) { el.tabIndex = -1; el.scrollIntoView({behavior: calm ? "auto" : "smooth", block: "start"}); el.focus({preventScroll: true}); }
}

/** Draws the "go to" index; while editing, the switches and arrows that show, hide and reorder the sections. */
function drawNav() {
  const u = L().ui, nav = document.getElementById("goto");
  nav.replaceChildren();
  if (editing) {
    layout.forEach((w, i) => {
      if (!hasData(w.id)) return;
      const tab = h("button", {type: "button", "aria-pressed": String(w.on), "data-k": "on-" + w.id}, u[w.id]);
      tab.addEventListener("click", () => setLayout(layout.map((x, j) => j === i ? {...x, on: !x.on} : x)));
      nav.append(tab);
      [[-1, "↑"], [1, "↓"]].forEach(([d, glyph]) => {
        const b = h("button", {type: "button", "data-k": "move-" + w.id + d, "aria-label": glyph + " " + u[w.id]}, glyph);
        b.addEventListener("click", () => {
          let j = i + d;
          while (j >= 0 && j < layout.length && !hasData(layout[j].id)) j += d;
          if (j < 0 || j >= layout.length) return;
          const next = layout.slice(); [next[i], next[j]] = [next[j], next[i]]; setLayout(next);
        });
        nav.append(b);
      });
    });
    return;
  }
  nav.append(h("span", {class: "lbl"}, u.goto));
  const go = (id, label) => { const b = h("button", {type: "button"}, label); b.addEventListener("click", () => goTo(id)); nav.append(b); };
  layout.filter(w => sectionShown(w.id)).forEach(w => go("sec-" + w.id, u[w.id]));
  if (!document.getElementById("missing").hidden) go("missing", u.missing);
}

/** Draws the whole page: title, project, warnings, the "go to" index, the sections with data and the tray of what is missing. */
function draw() {
  const u = L().ui, held = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = u.title;
  document.getElementById("lang").textContent = lang === "es" ? "EN" : "ES";
  const edit = document.getElementById("edit");
  edit.textContent = u.edit; edit.setAttribute("aria-pressed", String(editing));
  document.getElementById("layout").hidden = !editing;
  document.getElementById("layout-apply").textContent = u.apply;
  document.getElementById("layout-reset").textContent = u.reset;
  if (editing) document.getElementById("layout-json").value = JSON.stringify(layout);
  document.getElementById("runs").textContent = DATA.runs.map(r => r.name + (r.layer ? " (" + r.layer + ")" : "")).join(u.vs);
  drawProject();
  drawTags();
  drawMissing();
  drawNav();
  document.getElementById("sections").replaceChildren(...layout.filter(w => sectionShown(w.id)).map(w => {
    const card = h("section", {class: w.id === "tests" ? "stack" : "card", id: "sec-" + w.id});
    if (w.id !== "tests") card.append(h("div", {class: "lbl"}, u[w.id]));
    SECTIONS[w.id](card);
    return card;
  }));
  const back = held ? document.querySelector(`[data-k="${held}"]`) : null;
  if (back) back.focus({preventScroll: true});
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "es" ? "en" : "es";
  try { localStorage.setItem("metal-panel-lang", lang); } catch (e) { /* storage blocked */ }
  draw();
});
document.getElementById("edit").addEventListener("click", () => { editing = !editing; draw(); });
document.getElementById("layout-apply").addEventListener("click", () => {
  try {
    const next = JSON.parse(document.getElementById("layout-json").value);
    if (validLayout(next)) setLayout(complete(next));
  } catch (e) { /* invalid JSON is ignored */ }
});
document.getElementById("layout-reset").addEventListener("click", () => setLayout(defaultLayout()));

/** Draws the panel for the data in DATA the first time. */
function start() {
  KEY = "metal-panel-layout:v4:" + DATA.preset;
  layout = loadLayout();
  draw();
}

/** Live mode: reads the token and the choice of runs from the URL fragment (#token=...&runs=a,b&preset=fps) and
 * asks the server for the data every 10 s, drawing again only when it changed. Without runs it shows the newest. */
function live() {
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get("token");
  history.replaceState(null, "", location.pathname);
  const status = msg => { document.getElementById("runs").textContent = msg; };
  if (!token) return status("Open /panel#token=... with the server's token.");
  const query = new URLSearchParams();
  for (const k of ["runs", "preset", "skip_s"]) if (params.get(k)) query.set(k, params.get(k));
  const pull = () => fetch("/panel/data?" + query, {headers: {Authorization: "Bearer " + token}})
    .then(r => r.json().then(body => ({ok: r.ok, body}))).then(({ok, body}) => {
      if (!ok) throw new Error(body.error || "request failed");
      const text = JSON.stringify(body);
      if (text === last) return;
      const first = last === "";
      last = text; DATA = body;
      if (first) start(); else draw();
    }).catch(e => status("Could not load: " + e.message));
  pull();
  setInterval(pull, 10000);
}

if (DATA) start(); else live();
</script>
