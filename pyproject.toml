[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "metal-gpu-trace"
dynamic = ["version"]
description = "Measure Wine and macOS programs' GPU use on Apple silicon with Metal System Trace, from the shell or an MCP client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["mcp", "mcp-server", "metal", "apple-silicon", "gpu", "profiling", "wine", "xctrace", "instruments"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Benchmark",
]

[project.urls]
Homepage = "https://github.com/partprogramming09/metal-gpu-trace"
Changelog = "https://github.com/partprogramming09/metal-gpu-trace/blob/main/CHANGELOG.md"
Issues = "https://github.com/partprogramming09/metal-gpu-trace/issues"

[project.scripts]
metal-gpu-trace = "metal_gpu_trace.metal_trace_mcp:main"

[tool.hatch.version]
path = "src/metal_gpu_trace/metal_trace_mcp.py"

[tool.hatch.build.targets.wheel]
packages = ["src/metal_gpu_trace"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
extend-select = ["B"]
# short lambdas bound to a name and one-letter names inside comprehensions (l for a label row, I for the integer
# schema) are the house style
ignore = ["E731", "E741"]
