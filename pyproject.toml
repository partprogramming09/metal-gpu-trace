[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "metal-gpu-trace"
dynamic = ["version"]
description = "Measure Wine and macOS programs' GPU use on Apple silicon with Metal System Trace, from the shell or an MCP client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["mcp", "mcp-server", "metal", "apple-silicon", "gpu", "profiling", "wine", "xctrace", "instruments"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Benchmark",
]

[project.urls]
Homepage = "https://github.com/partprogramming09/metal-gpu-trace"
Changelog = "https://github.com/partprogramming09/metal-gpu-trace/blob/main/CHANGELOG.md"
Issues = "https://github.com/partprogramming09/metal-gpu-trace/issues"

[project.scripts]
metal-gpu-trace = "metal_gpu_trace.metal_trace_mcp:main"

[tool.hatch.version]
path = "metal_trace_mcp.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"metal_trace_mcp.py" = "metal_gpu_trace/metal_trace_mcp.py"
"gputrace_read.py" = "metal_gpu_trace/gputrace_read.py"
"perf_report.py" = "metal_gpu_trace/perf_report.py"
"perf_record.sh" = "metal_gpu_trace/perf_record.sh"
"data" = "metal_gpu_trace/data"
