name: Reportar un fallo
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Si es un fallo de seguridad, no lo reportes aquí; sigue la política de seguridad del repositorio.
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué hiciste, qué esperabas y qué ocurrió. Pega la salida real, sin datos personales.
    validations:
      required: true
  - type: textarea
    id: como-reproducirlo
    attributes:
      label: Cómo reproducirlo
      description: Los pasos, en orden.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión y sistema
      description: Versión del proyecto y sistema operativo.
