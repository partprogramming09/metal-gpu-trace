name: test

on: [push, pull_request]

# jobs get only read access unless they ask for more
permissions:
  contents: read

jobs:
  # ubuntu-latest (26.04) has no Python 3.9 for setup-python: the 3.9 jobs run on 24.04
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: sudo apt-get install -y zsh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -I tests/run.py

  # the installed package must start: catches a file the wheel leaves out, which tests from the checkout cannot see
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.9"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: sh tests/smoke_wheel.sh python

  # the official MCP SDK, as an independent client, talks to the server in both eras (pinned: bump on purpose)
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uvx --python 3.13 --with mcp==2.3.0 --with pytest pytest -q -p no:cacheprovider tests/conformance

  # the Windows and macOS jobs run only when a file they cover changed: a docs-only change does not wait for them
  changes:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.diff.outputs.windows }}
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          windows=false macos=false
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            windows=true macos=true
          else
            files=$(git diff --name-only "$BASE" HEAD)
            grep -qE '^(src/metal_gpu_trace/[^/]+\.py|tests/(test_perf_record_windows|conftest)\.py|\.github/workflows/test\.yml)$' <<< "$files" && windows=true
            grep -qE '^(src/metal_gpu_trace/|tests/|\.github/workflows/test\.yml)' <<< "$files" && macos=true
          fi
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          exit 0

  # the script and its tests use macOS's own ps, pkill and zsh: the Linux job cannot catch a bug that is macOS-only
  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - run: python -I tests/run.py

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_perf_record_windows.py -k "cancel or timeout" -v
